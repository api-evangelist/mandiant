aid: mandiant

name: Mandiant

description: Mandiant, now part of Google Cloud, is a threat intelligence and cyber defense company whose Mandiant Advantage platform exposes
  several authenticated REST APIs documented at docs.mandiant.com. The Threat Intelligence (MATI) API v3 serves indicators, finished intelligence
  reports, threat actors, malware families, vulnerabilities and campaigns; the Digital Threat Monitoring API surfaces exposed credentials and
  brand/deep-and-dark-web threats; the Attack Surface Management API inventories an organization's external assets; and the Security Validation
  (MSV) API drives automated testing of security controls. These APIs authenticate with an API key and secret that is exchanged for a short-lived
  bearer access token. Mandiant's frontline threat data now also powers Google Threat Intelligence alongside VirusTotal.

