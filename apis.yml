- aid: mandiant:mandiant-audit-logs-api
  name: Mandiant Audit Logs API
  description: >-
    The Validation Platform Director has a consolidated audit log that tracks Validation Platform activity.
    As a general overview, the type of data in the Audit log is captured below. Each record is categorized
    using a Section and Action Type.


    For a list of Section and Action Type values, see Audit Log Record Categorization. Some of the types
    of data it captures includes:


    * Security Content changes: Creating, Updating, and Deleting Actions, Sequences, Evaluations, Files

    * Director changes: Updating admin settings; updating network devices; adding, updating, removing
    notifications

    * Instructions sent to the Actors: Check time sync, check version

    * User Access: Login, Logout, Authentication failures

    * Running Jobs

    * Integrations: Adding, updating, removing Integrations

    * User Actions: Users accessing reports
  humanURL: https://docs.mandiant.com/home/mati-threat-intelligence-api-v3
