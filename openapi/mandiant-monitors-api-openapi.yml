              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Estimate how many alerts will be created for the backfill of a newly created…
      tags:
      - Monitors
      security:
      - My_API_Key: []
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
  /monitors/templates:
    parameters: []
    get:
      description: Lists all monitor templates for top DTM use cases. Templates are intended to be the starting place for montior creation based on a specific use case.
      operationId: get-monitor-templates
      parameters:
      - description: The type of content accepted.
        in: header
        name: Accept
        schema:
          default: application/json
          example: application/json
          type: string
      responses:
        '200':
