openapi: 3.2.0
info:
  title: Mandiant Monitors API
  version: '1.0'
  description: 'Operations tagged Monitors across 6 of this provider''s published API definitions: mandiant-dtm-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-dtm-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.intelligence.mandiant.com/v4/dtm
tags:
- name: Monitors
paths:
  /monitors:
    parameters: []
    get:
      description: Lists all monitors belonging to the current organization. Pagination is supported and the URI to next page of results is provided in the response link header. If fetching subsequent pages, only use the next link header provided in the previous page of results.
      operationId: get-monitors
      parameters:
      - description: The monitor field name to sort the response monitors by.
        in: query
        name: sort
        schema:
          default: created_at
          enum:
          - id
          - name
          - description
          - created_at
          - updated_at
          example: updated_at
          type: string
      - description: The order used to sort the response monitors.
        in: query
        name: order
        schema:
          default: desc
          enum:
          - desc
          - asc
          example: asc
          type: string
      - description: The number of monitors to return in each page.
        in: query
        name: size
        schema:
          default: 10
          example: 20
          type: integer
      - description: The type of content accepted.
        in: header
        name: Accept
        schema:
          default: application/json
          example: application/json
          type: string
      - description: When listing monitors by date range, since defines the starting date in RFC3339 format
        in: query
        name: since
        schema:
          format: date-time
          type: string
      - description: When listing monitors by date range, until defines the ending date in RFC3339 format
        in: query
        name: until
        schema:
          type: string
      - description: Only used when fetching subsequent pages during pagination and will contain a unique page ID. No other query parameters can be used with page
        in: query
        name: page
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitors'
          description: OK
          headers:
            Link:
              description: If another page of results is available for pagination, the Link header will contain the URI used to fetch the next page.
              schema:
                example: <https://api.intelligence.mandiant.com/v4/dtm/monitors?page=c52e5bc1hrv40t8d0gvg>; rel="next"
                type: string
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: List monitors
      tags:
      - Monitors
      security:
      - My_API_Key: []
    post:
      description: Create a new monitor.
      operationId: post-monitor
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
        schema:
          example: application/json
          type: string
      - description: If true and a template_id is set, we will return 400 bad request if it the monitor does not adhear to the template
        in: query
        name: strict
        schema:
          default: true
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
        description: Create a new monitor.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: OK
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Create a new monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
  /monitors/{id}:
    parameters:
    - description: The monitor ID.
      in: path
      name: id
      required: true
      schema:
        type: string
    delete:
      description: Delete an existing monitor by its ID.
      operationId: delete-monitor-id
      parameters: []
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '404':
          content:
            application/json:
              examples:
                not-found:
                  value:
                    message: Not Found
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Delete an existing monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    get:
      description: Get an existing monitor by ID.
      operationId: get-monitor-id
      parameters:
      - description: application/json
        in: header
        name: Accept
        required: true
        schema:
          default: application/json
          example: application/json
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: OK
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '404':
          content:
            application/json:
              examples:
                not-found:
                  value:
                    message: Not Found
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Get a monitor by its ID
      tags:
      - Monitors
      security:
      - My_API_Key: []
    patch:
      description: Partial update an existing monitor with the fields in the request body. This request only updates the specified fields in the request body; the remaining fields of the existing monitor are unchanged.
      operationId: patch-monitor-id
      parameters:
      - description: The accept type supported in the response.
        in: header
        name: Accept
        required: true
        schema:
          default: application/json
          example: application/json
          type: string
      - description: The content type of the request body.
        in: header
        name: Content-Type
        required: true
        schema:
          default: application/json
          example: application/json
          type: string
      - description: If true and a template_id is set, we will return 400 bad request if it the monitor does not adhear to the template
        in: query
        name: strict
        schema:
          default: true
          type: boolean
      requestBody:
        content:
          application/json:
            examples:
              patch-monitor:
                value:
                  description: My updated description
            schema:
              $ref: '#/components/schemas/Monitor'
        description: The monitor fields to update.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: OK
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '404':
          content:
            application/json:
              examples:
                not-found:
                  value:
                    message: Not Found
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Partial update an existing monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    put:
      description: Update an existing monitor by replacing all its fields with the given body.
      operationId: put-monitor-id
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
        schema:
          type: string
      - description: application/json
        in: header
        name: Accept
        required: true
        schema:
          default: application/json
          example: application/json
          type: string
      - description: If true and a template_id is set, we will return 400 bad request if it the monitor does not adhear to the template
        in: query
        name: strict
        schema:
          default: true
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
        description: The monitor to validate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: OK
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '404':
          content:
            application/json:
              examples:
                not-found:
                  value:
                    message: Not Found
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Update an existing monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
  /monitors/{id}/backfill:
    patch:
      description: Asynchronously backfill alerts for the new domains added in the latest version of the monitor (when compared to it's previous version) using the time range specified. This API is only supported for monitors created from the Compromised Credential monitor template and will create at most 10,000 alerts.
      operationId: patch-monitor-backfill
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
        schema:
          example: application/json
          type: string
      - description: The ID of the monitor to begin a backfill for.
        in: path
        name: id
        required: true
        schema:
          example: c4huif0mhcmiku5g7jsg
          type: string
      - description: Backfill alerts starting from this date in RFC3339 format
        in: query
        name: since
        schema:
          format: date-time
          type: string
      - description: Backfill alerts ending at this date in RFC3339 format
        in: query
        name: until
        schema:
          type: string
      responses:
        '202':
          description: Accepted
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Asynchronously backfill alerts for new domains
      tags:
      - Monitors
      security:
      - My_API_Key: []
    post:
      description: Begin a new alert backfill for the current monitor using the time range specified. This API is only supported for monitors created from the Compromised Credential monitor template and will create at most 10,000 alerts.
      operationId: post-monitor-backfill
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
        schema:
          example: application/json
          type: string
      - description: The ID of the monitor to begin a backfill for.
        in: path
        name: id
        required: true
        schema:
          example: c4huif0mhcmiku5g7jsg
          type: string
      - description: Backfill alerts starting from this date in RFC3339 format
        in: query
        name: since
        schema:
          format: date-time
          type: string
      - description: Backfill alerts ending at this date in RFC3339 format
        in: query
        name: until
        schema:
          type: string
      responses:
        '202':
          description: Accepted
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Asynchronously backfill alerts for the monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
  /monitors/{id}/backfill/esimate:
    patch:
      description: Estimate how many alerts will be created when backfilling the given updated monitor. Only newly added domains are considered for backfill. Backfill is only applicable for monitors created from the Compromised Credential monitor template.
      operationId: patch-monitor-backfill-estimate
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
        schema:
          example: application/json
          type: string
      - description: The monitor ID.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Backfill alerts starting from this date in RFC3339 format
        in: query
        name: since
        schema:
          format: date-time
          type: string
      - description: Backfill alerts ending at this date in RFC3339 format
        in: query
        name: until
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorBackfillEstimate'
          description: OK
        '400':
          content:
            application/json:
              examples:
                bad-request:
                  value:
                    message: Bad Request
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Estimate how many alerts will be created for the backfill of an updated monitor
      tags:
      - Monitors
      security:
      - My_API_Key: []
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
  /monitors/backfill/esimate:
    post:
      description: Estimate how many alerts will be created when backfilling the given new monitor. Backfill is only applicable for monitors created from the Compromised Credential monitor template.
      operationId: post-monitor-backfill-estimate
      parameters:
      - description: application/json
        in: header
        name: Content-Type
        required: true
