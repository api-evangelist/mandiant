  /monitor/update_data:
    get:
      summary: AEDA Dashboard data
      description: Data used to build the AEDA Dashboard Environment Map
      tags:
      - Monitors
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                map_data:
                  green_paths: []
                  alert_paths:
                  - - node-2
                    - node-1
                  zone_alarms:
                    zone-2:
                      zone-5: 3
                  zone_stats:
                    zone-2:
                      zone-5: 3
                widgets:
                  breakdown_tooltips:
                  - 0 Passed
                  - 0 Passed
                  - 0 Passed
                  - 0 Passed
                  - 0 Passed
                  - 0 Passed
                  breakdown_data:
                  - 0
                  - 0
                  - 0
                  - 0
                  - 0
                  - 0
                stats:
                  alert_count: 3
                  unique_count: 8
                  monitor_count: 8
      operationId: getMonitorUpdateData
      x-operation-id-source: derived
components:
  schemas:
    MonitorTemplate:
      description: Monitor templates provide suggested monitor conditions based on top DTM use cases.
      properties:
        description:
          description: The description of the monitor.
          type: string
        doc_condition:
          $ref: '#/components/schemas/Condition'
        id:
          description: The ID of the monitor.
          example: c4fbb52bqsiatib6i4gg
          readOnly: true
          type: string
        name:
          description: The name of the monitor.
          type: string
      required:
      - doc_condition
      title: Monitor Template
      type: object
    Monitor:
      description: A monitor defines 1 or more conditions and an optional doc query string to use for matching documents of interest. Matching a document results in the creation of an alert.
      properties:
        created_at:
          description: The timestamp the monitor was created.
          example: '"2021-08-19T19:48:36Z"'
          format: date-time
          readOnly: true
          type: string
        created_by_user_email:
          description: The user's name that created the monitor.
          readOnly: true
          type: string
        created_by_user_id:
          description: The ID of the user that created the monitor.
          readOnly: true
          type: string
        description:
          description: The description of the monitor.
          type: string
        doc_condition:
          $ref: '#/components/schemas/Condition'
        email_notify_enabled:
          description: If email notifications are enabled for this monitor.
          type: boolean
        email_notify_immediate:
          description: If immediate email delivery is enabled for this monitor.
          type: boolean
        enabled:
          description: If the monitor is enabled or not.
          type: boolean
        id:
          description: The ID of the monitor.
          example: c4fbb52bqsiatib6i4gg
          readOnly: true
          type: string
        last_updated_by_user_id:
          description: The ID of the user that last updated the monitor.
          readOnly: true
          type: string
        last_updated_user_email:
          description: The user's name that last updated the monitor.
          readOnly: true
          type: string
        name:
          description: The name of the monitor.
          type: string
        password_policy:
          $ref: '#/components/schemas/PasswordPolicy'
        template_id:
          description: If a monitor was created from a template, then this field is populated with the template's ID. It cannot be changed after creation.
          readOnly: true
          type: string
        updated_at:
          description: The timestamp the monitor was last updated.
          example: '"2021-08-19T19:48:36Z"'
          format: date-time
          readOnly: true
          type: string
        version:
          description: The version number for the monitor. A monitor's version is incremented each time the monitor is updated.
          readOnly: true
          type: integer
      required:
      - doc_condition
      title: Monitor
      type: object
    Response-message:
      description: Error response message.
      properties:
        message:
          description: The response message.
          type: string
      title: Error Response
      type: object
    MonitorTemplates:
      description: A list of monitor templates for top DTM use cases.
      properties:
        templates:
          description: The list of monitor templates.
          items:
            $ref: '#/components/schemas/MonitorTemplate'
          type: array
      title: Monitor Templates
      type: object
    Condition:
      description: A Condition forms the basis for querying topics and labels in monitors. It can be used to form complex conditions using all/any as well as specifying specific values to match for documents. See the user guide for more details.
      properties:
        match:
          description: The match values, or sub Conditions.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
        operator:
          description: The operator to use for this Condition.
          enum:
          - must_equal
          - must_not_equal
          - must_start_with
          - must_not_start_with
          - must_end_with
          - must_not_end_with
          - must_contain
          - must_not_contain
          - any
          - all
          type: string
        topic:
          description: The topic to apply this Condition to.
          enum:
          - doc_type
          - source
          - match_conditions
          - credential_domain
          - typosquatted_domain
          - keyword
          - lucene
          - group_bin
          - group_brand
          - group_crypto
          - group_hash
          - group_identity
          - group_keys
