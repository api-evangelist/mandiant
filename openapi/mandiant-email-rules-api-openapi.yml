openapi: 3.2.0
info:
  title: Mandiant Email rules API
  version: '1.0'
  description: 'Operations tagged Email rules across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Email rules
  description: Rules to use when determining the results of Email Actions
paths:
  /settings/email_rules:
    get:
      summary: List email rules
      tags:
      - Email rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 3
                organization_id: 36
                rule_type: blocked
                search_area: body
                regex: Undeliverable
                created_at: '2020-02-10T15:14:03.808Z'
                updated_at: '2020-02-10T15:14:03.808Z'
              - id: 4
                organization_id: 36
                rule_type: blocked
                search_area: body
                regex: example regex
                created_at: '2020-02-10T15:14:03.810Z'
                updated_at: '2020-02-10T15:14:03.810Z'
      operationId: getSettingsEmailRules
      x-operation-id-source: derived
    post:
      summary: Create an email rule
      tags:
      - Email rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email_rule_wrapped'
            example:
              email_rule:
                regex: example regular expression
                search_area: body
                rule_type: blocked
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 1
                organization_id: 34
                rule_type: blocked
                search_area: body
                regex: example regular expression
                created_at: '2020-02-10T15:13:36.284Z'
                updated_at: '2020-02-10T15:13:36.284Z'
      operationId: postSettingsEmailRules
      x-operation-id-source: derived
  /settings/email_rules/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: The ID of the email rule to lookup.
    get:
      summary: Show an email rule
      tags:
      - Email rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 5
                organization_id: 37
                rule_type: blocked
                search_area: body
                regex: Undeliverable
                created_at: '2020-02-10T15:14:16.765Z'
                updated_at: '2020-02-10T15:14:16.765Z'
      operationId: getSettingsEmailRulesById
      x-operation-id-source: derived
    delete:
      summary: Destroy an email rule
      tags:
      - Email rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                result: success
      operationId: deleteSettingsEmailRulesById
      x-operation-id-source: derived
components:
  schemas:
    email_rule_wrapped:
      type: object
      properties:
        email_rule:
          $ref: '#/components/schemas/email_rule'
    email_rule:
      type: object
      required:
      - regex
      - rule_type
      - search_area
      properties:
        regex:
          type: string
          description: 'A string that''s interpreted as a regular expression to match in email subject or body.  Must be a valid Ruby regex

            '
        rule_type:
          type: string
          enum:
          - blocked
          - error
          description: Which result to consider as matching this rule
        search_area:
          type: string
          enum:
          - body
          - subject
          description: Area of email in which to look for matches of the regex parameter
x-refined-from:
- mandiant-ma-sv-openapi.yml
- mandiant-msv-openapi.yml
- mandiant-ma-sv-openapi.yml
- mandiant-msv-openapi.yml
