components:
  schemas:
    user_wrapped:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/user'
    user:
      type: object
      required:
      - email
      - first_name
      - last_name
      - user_group_id
      properties:
        email:
          type: string
          description: 'Email address for user.  This is used for the login for each user.  Must be a valid email address.

            '
        first_name:
          type: string
        last_name:
          type: string
        user_group_id:
          type: integer
          description: ID indicating UserGroup to which User belongs
