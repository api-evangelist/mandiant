openapi: 3.2.0
info:
  title: Mandiant Jobs API
  version: '1.0'
  description: 'Operations tagged Jobs across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Jobs
  description: Jobs are the results of Actions, Evaluations, or Sequences that have been run. They contain JobSteps and JobActions
paths:
  /jobs:
    get:
      summary: List jobs
      tags:
      - Jobs
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 2
                plan_id: 2
                status: completed
                progress: Completed Group
                created_at: '2020-02-10T15:14:43.014Z'
                updated_at: '2020-02-10T15:14:43.014Z'
                organization_id: 39
                status_desc: Example job status description
                user_id: 1
                simulation_id: 6
                node_action_queue_id: 10
                monitor: null
                scheduled_action_id: 1
                planner_controlled: null
                desc: Example job description
                name: Example Job Name
                parent_job_id: null
      operationId: getJobs
      x-operation-id-source: derived
  /jobs/{id}/cancel:
    get:
      summary: Cancel a running job
      tags:
      - Jobs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The ID of the job to cancel.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 6
                plan_id: 6
                status: cancelled
                progress: Cancelled all remaining actions
                created_at: '2020-02-10T15:15:22.841Z'
                updated_at: '2020-02-10T15:15:22.886Z'
                organization_id: 51
                status_desc: Example job status description
                user_id: 1
                simulation_id: 21
                node_action_queue_id: 10
                monitor: null
                scheduled_action_id: 4
                planner_controlled: null
                desc: Example job description
                name: Example Job Name
                parent_job_id: null
      operationId: getJobsByIdCancel
      x-operation-id-source: derived
  /jobs/{id}/run_again:
    post:
      summary: Run a job again
      description: This endpoint doesn't require a request body.
      tags:
      - Jobs
      parameters:
      - name: id
        in: path
        required: true
        description: ID of Job to run again
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 5
                plan_id: 5
                status: waiting
                progress: Preparing Job
                created_at: '2020-02-10T15:15:09.630Z'
                updated_at: '2020-02-10T15:15:09.630Z'
                organization_id: 47
