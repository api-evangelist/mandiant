  /v2/jobs/{id}:
    get:
      summary: Show detailed information for a job
      description: 'This is the API endpoint that backs the job result page in the UI. By default it includes a lot of information about the Job and the actions that ran in it. The exact information included in the response can be limited by using the `only` or `exclude` params. The `integrations` field in the top level of the response is included by default, but can be excluded using the `exclude` param. For admin and power users it includes the full integration information, but for other users it includes a limited subset.


        By default, the integration_events field for each job_action in this response will omit the untranslated field and will truncate the raw_event field to a max of 1024 characters. If you need to include the entire raw_event field, pass `integration_events.raw_event` in the include param. If you need to include the untranslated field, pass `integration_events.untranslated` in the `include` param.'
      tags:
      - Jobs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: "This is the ID of the job and must be included in the path at `GET /v2/jobs/{id}.json`.  For example, `GET /v2/jobs/123.json` will return the JSON response for the Job with ID 123.      \n"
      - name: pretty
        in: query
        description: 'If present, return pretty-printed JSON.  This param doesn''t need to be set to any value, just included in the query param string of the request.


          For example, `GET /v2/jobs/1.json?pretty` will return the pretty-printed JSON response for Job 1.


          If you want to combine this other params, use an `&` like normal for combining query params.  For example, `GET /v2/jobs/1.json?pretty&only=id` or `GET /v2/jobs/1.json?only=id&pretty` would both return the pretty-printed response for Job 1 with only the job action ID keys included in the response.   See the only and exclude params below for more details.

          '
        schema: {}
      - name: only
        in: query
        description: "If present, specify the set of fields returned in the job_action objects of the response.\nThis can be an array, a comma-separated string, or a single value.\nThe higher-level fields outside of job_actions will still be included.\nFor example `only=id,vid` would include only the id and vid attributes under job_actions, as well as all fields above job_actions in the response structures.\nYou can pass any number of fields here that are included by default in the unfiltered response.\n\nTo get a full up-to-date list of the fields that are available, you can first make a request to this endpoint without any params specified.  Look at the `job_steps[].job_actions[]` objects in the response.  Any key names in those are valid to use in this param.  Currently, specifying nested keys under those objects is not supported.\n\nThis is not a complete list, but here are some of useful fields you may want to put in this param to limit the data returned:\n  * id\n  * sim_action_id\n  * action_name\n  * vid\n  * tags - list of tags from the action, and from the sequence/evaluation if applicable\n  * detected\n  * blocked\n  * alerted\n  * status\n  * attack_node_id\n  * target_node_id\n  * source_actor\n  * source_security_zone\n  * destination_actor\n  * destination_security_zone\n  * user_profile\n  * event_count\n  * blocking_technologies - list of the Security Technologies that blocked the JobAction\n  * security_technologies - list of the Security Technologies that detected the JobAction, including list of event IDs for each\n"
        schema:
          oneOf:
          - type: string
          - type: integer
          - type: array
      - name: include
        in: query
        description: 'If present, include extra fields in the job_action objects of the response.  This can be an array, a comma-separated string, or a single value.  Currently all fields are included by default, except for a partial `integration_events.raw_event` field, and the omitted `integration_events.untranslated` field.  You can include both of these fields in the response by comma-separating them like `include=integration_events.raw_event,integration_events.untranslated`.  Be aware that these fields could potentially be large, causing slow performance and/or high memory usage.  If you have problems with them, then try using the `GET /integration_events` endpoint to get full event detail for specific JobActions instead.

          '
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: exclude
        in: query
        description: 'If present, restrict the fields returned in the job_action objects of the response.  This can be an array, a comma-separated string, or a single value.  For example `exclude=action` would exclude the action attribute under the job_action objects and include all other fields.  See the details listed in the only param for specific field names that can be used here.


          The string "action" in this param has a special meaning.  In addition to the action key, it will also remove these keys from the job_action objects: tags, vid, action_name, annotation, and attachments.  If you want to remove the action key but keep any of those others, you can combine it with an include param.  For example, `?exclude=action&include=action_name,vid,tags` will omit the action key but keep the action_name, vid, and tags keys.


          The string "integrations" in this param will affect the top-level integrations key in this response.  Currently it''s the only field name handled that''s outside of the job_action objects.

          '
        schema:
          oneOf:
          - type: string
          - type: integer
          - type: array
      - name: max_attack_version
        in: query
        description: 'If the current Director has Mitre Tactic and Technique categories loaded into its system, each response''s Action object will also have a "mitre_attack_techniques" object.  This object will the requested version identifier as well as a list of Mitre Technique information.  This Mitre Technique information will be governed by the provided dot-notated version identifier.  Any Mitre Techniques above the given version will be filtered out of the response, as well as any Mitre Techniques that have been revoked before/within the given version.


          When this parameter is not provided, the Director will default to the highest Mitre ATT&CK version present on the Director.

          If no Mitre ATT&CK information is present on the current Director and no max_attack_version is requested, this "mitre_attack_technique" key/value pair will not be available.

          If the request stipulates a max_attack_version that is not supported by the current Director (or if the parameter is provided but no Mitre Tactic or Technique information can be located on the system) then the response will error with a 404 status and an appropriate error message with available Mitre ATT&CK versions.

          '
        schema:
          oneOf:
          - type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Example only param:
                  description: '`GET /v2/jobs/6404.json?pretty&only=detected,blocked,action_name,vid,id`'
                  value:
