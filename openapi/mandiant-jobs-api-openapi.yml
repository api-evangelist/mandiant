                parent_job_id: null
      operationId: postJobsByIdRunAgain
      x-operation-id-source: derived
  /jobs/run_now:
    post:
      summary: Run a job from a sequence or evaluation
      description: The ID of the sequence or evaluation should be passed as the sim_id parameter; to get a list of available IDs, use the GET /simulations API endpoint. To run a single action instead of a sequence or evaluation, use the POST /manage_sims/actions/{id}/run API endpoint.
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/run_job'
            example:
              sim_id: 29
              schedule_run_now_selector: run_now
              attack_node_id_1: '2'
              target_node_id_1: '3'
              attack_node_id_2: '2'
              target_node_id_2: '3'
      responses:
