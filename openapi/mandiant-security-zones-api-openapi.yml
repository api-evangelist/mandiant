openapi: 3.2.0
info:
  title: Mandiant Security zones API
  version: '1.0'
  description: 'Operations tagged Security zones across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Security zones
  description: Security Zones are regions within the network that contain actors and can be considered as being Internal or External. Each actor must belong to exactly one Security Zone.
paths:
  /security_zones:
    get:
      summary: List security zones
      tags:
      - Security zones
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 263
                name: Internet
                desc: Default Internet zone
                created_at: '2020-02-10T15:21:02.250Z'
                updated_at: '2020-02-10T15:21:02.250Z'
                organization_id: 88
                disabled: false
              - id: 264
                name: Internal Servers
                desc: Default Internal Servers zone
                created_at: '2020-02-10T15:21:02.255Z'
                updated_at: '2020-02-10T15:21:02.255Z'
                organization_id: 88
                disabled: false
              - id: 265
                name: Desktop Users
                desc: Default Desktop Users zone
                created_at: '2020-02-10T15:21:02.261Z'
                updated_at: '2020-02-10T15:21:02.261Z'
                organization_id: 88
                disabled: false
              - id: 266
                name: DMZ
                desc: Default DMZ zone
                created_at: '2020-02-10T15:21:02.266Z'
                updated_at: '2020-02-10T15:21:02.266Z'
                organization_id: 88
                disabled: false
      operationId: getSecurityZones
      x-operation-id-source: derived
    post:
      summary: Create a security zone
      tags:
      - Security zones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/security_zone_wrapped'
            example:
              security_zone:
                name: Example Security Zone
                desc: Test description
                zone_attr_ids:
                - 109
      responses:
        '201':
          description: Success
          content:
            application/json:
              example:
                id: 278
                name: Example Security Zone
                desc: Test description
                created_at: '2020-02-10T15:21:30.783Z'
                updated_at: '2020-02-10T15:21:30.783Z'
                organization_id: 90
                disabled: false
      operationId: postSecurityZones
      x-operation-id-source: derived
  /security_zones/{id}:
    get:
      summary: Show a security zone
      tags:
      - Security zones
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/security_zone'
              example:
                id: 268
                name: Internet
                desc: Default Internet zone
                created_at: '2020-02-10T15:21:14.986Z'
                updated_at: '2020-02-10T15:21:14.986Z'
                organization_id: 89
                disabled: false
      operationId: getSecurityZonesById
      x-operation-id-source: derived
    put:
      summary: Update a security zone
      tags:
      - Security zones
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/security_zone_wrapped'
            example:
              security_zone:
                desc: Updated description
      responses:
        '204':
          description: No content
          content:
            application/json:
              example: null
      operationId: putSecurityZonesById
      x-operation-id-source: derived
    delete:
      summary: Destroy a security zone
      tags:
      - Security zones
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                status: Successfully deleted Security Zone test
      operationId: deleteSecurityZonesById
      x-operation-id-source: derived
components:
  schemas:
    security_zone:
      type: object
      required:
      - name
      - desc
      - zone_attr_ids
      properties:
        name:
          type: string
          description: Name of security zone, must be unique.
        desc:
          type: string
          description: Description of security zone
        disabled:
          type: boolean
          readOnly: true
          description: Indicates whether security zone is disabled
        zone_attr_ids:
          description: 'IDs of zone attributes belonging to a security zone.

            To retrieve the list of security zone attribute IDs, run this http request:

            GET /security_zone_attributes

            The response will include the security zone attribute objects associated with their IDs.

            '
          type: array
          items:
            type: integer
    security_zone_wrapped:
      type: object
      properties:
        security_zone:
          $ref: '#/components/schemas/security_zone'
