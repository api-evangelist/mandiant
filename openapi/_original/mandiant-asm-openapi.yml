openapi: 3.0.0
info:
  title: ASM V1 API (Public)
  description: >-
    All endpoints require the following header:


    - INTRIGUE_ACCESS_KEY : {{intrigue_access_key}}


    - INTRIGUE_SECRET_KEY : {{intrigue_secret_key}}


    Most endpoints will require specifying a project ID with the following
    header name:


    - PROJECT_ID : {{project_id}}


    API keys can be generated in the platform by any user under their account
    settings.


    The {{base_url}} is expected to be
    [https://asm-api.advantage.mandiant.com,](https://asm-api.advantage.mandiant.com,)
    unless otherwise specified.
  version: 1.0.6
servers:
  - url: http://{{base_url}}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: Projects
    description: >-
      Projects are the most foundational unit of organization in the ASM
      platform. Collections exist within one and only one project.
  - name: Collections
    description: >-
      Collections live under a project and are another foundational unit of
      organization in the ASM platform. They define the process of collecting
      entities, issues and technologies. All entities, issues and technologies
      live within one and only one collection (and its corresponding project).
  - name: Collection Runs
  - name: Entities
  - name: Issues
  - name: Time Series
  - name: Technologies
  - name: Notes
  - name: Tags
  - name: Seeds
    description: deletes a user entity / seed
  - name: Integrations
    description: >-
      Add your integration(s) here. Once added you can associate them to a
      collection within the Integrations Collections section.
  - name: Integration Collections
    description: Configure Collections with integrations for Cloud credential associations.
  - name: Library
paths:
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: Index
      description: List all projects
      security:
        - noauthAuth: []
      parameters:
        - name: INTRIGUE_ACCESS_KEY
          in: header
          schema:
            type: string
          example: '{{intrigue_access_key}}'
        - name: INTRIGUE_SECRET_KEY
          in: header
          schema:
            type: string
          example: '{{intrigue_secret_key}}'
      responses:
        undefined:
          content:
            application/json:
              schema:
                type: object
              example:
                success: true
                message: Projects
                result:
                  - id: 6797
                    created_at: '2022-08-18T16:10:20.842Z'
                    uuid: be884e25-a0bb-4836-a836-df5eab176186
