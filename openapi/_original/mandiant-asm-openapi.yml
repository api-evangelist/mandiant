    post:
      tags:
        - Projects
      summary: Create
      description: |-
        Create a new project

        Body:

        ``` json
        {
            "name" : "New Project Name"
        }

        ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: New Project Name
      parameters:
        - name: INTRIGUE_ACCESS_KEY
          in: header
          schema:
            type: string
          example: '{{intrigue_access_key}}'
        - name: INTRIGUE_SECRET_KEY
          in: header
