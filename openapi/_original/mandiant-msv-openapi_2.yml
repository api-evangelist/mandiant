  /v2/simulations/library_simulations_list:
    get:
      summary: |
        List sequences or evaluations
      tags:
        - Sequences and Evaluations
      parameters:
        - name: simulation_type
          in: query
          required: true
          description: |
            Indicate whether you want to list sequences or evaluations
          schema:
            type: string
            enum:
              - sequences
              - evaluations
        - name: search
          in: query
          description: |
            Searches for given input across multiple fields: name, VID & description

            e.g. `GET /v2/simulations/library_simulations_list?search=owasp`
          schema:
            type: string
        - name: content_tree_ids
          in: query
          description: |
            Filter by Content Tree. Use below values to include corresponding data:
            * 1: Sys
            * 2: User
            * 3: Outside
            * 4: Threat Intel
            * 5: Pending

            e.g. `GET /v2/simulations/library_simulations_list?content_tree_ids[]=2&content_tree_ids[]=5`
          schema:
            type: array
            items:
              type: string
              enum:
                - '1'
                - '2'
                - '3'
                - '4'
                - '5'
        - name: tags
          in: query
          description: |
            Filter by tags.

            e.g. `GET /v2/simulations/library_simulations_list?&tags[]=CVE-2018-4878&tag_logic=OR`
          schema:
            type: array
            items:
              type: string
        - name: tag_logic
          in: query
          description: |
            logic used when using multiple values in tags query param.

            e.g. `GET /v2/simulations/library_simulations_list?tags[]=foo&tags[]=bar&tag_logic=OR`
          schema:
            type: string
            enum:
              - OR
              - AND
        - name: content_uuids
          in: query
          description: |
            Filter by content uuids

            e.g. `GET /v2/simulations/library_simulations_list?content_uuids[]=1352574b-054d-4238-8326-0b73774132bc&content_uuids[]=a5f5a9ba-7de5-4380-ac5c-c219fc00adcf`
          schema:
            type: array
            items:
              type: string
        - name: last_run_status
          in: query
          description: |
            Filter by last run status of job action

            e.g. `GET /v2/simulations/library_simulations_list?last_run_status[]=cancelled`
          schema:
            type: array
            items:
              type: string
              enum:
                - completed
                - errored
                - cancelled
                - never_ran
        - name: last_run_date
          in: query
          description: |
            Filter by last run date of job action. Format: YYYY-mm-dd

            e.g. `GET /v2/simulations/library_simulations_list?last_run_date=2023-12-31`
          schema:
            type: string
        - name: show_full_response
          in: query
          description: |
            Get detailed output in response which includes multiple attributes

            e.g. `GET /v2/simulations/library_simulations_list?show_full_response=true`
          schema:
            type: string
            enum:
              - 'true'
        - name: order_by
          in: query
          description: |
            Sort result based on an attribute

            e.g. `GET /v2/simulations/library_simulations_list?page_number=1&page_size=2&order_by=id`
          schema:
            type: string
            enum:
              - id
              - name
              - vid
              - updated_at
              - last_added
              - last_run
              - total_runs
        - name: direction
          in: query
          description: |
            Sorting direction

            e.g. `GET /v2/simulations/library_simulations_list?page_number=1&page_size=2&order_by=id&direction=desc`
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                simulations:
                  - id: 4181577
                    name: Malicious Activity Scenario - Campaign 24-001, Phishing Campaign Distributing ASYNCRAT
                    updated_at: '2024-01-17T19:54:24.930Z'
                    simulation_type: sequence
