    post:
      summary: Run an action
      description: |
        Execute the Action specified by id in the URL and return the resulting job.  See the GET /jobs/{id} documentation for descriptions of the response values.  To get the ID for the Action you want to run, use the GET /manage_sims/actions API call which returns a list of all Actions on Director.  Must end with either ".json" or ".xml".
