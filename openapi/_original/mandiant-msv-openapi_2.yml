        steps:
          description: |
            Actions to include per group.  Must be an object with the order of each group as the key and the array of action IDs in that group as the value.  The order starts at 0 for the first group.  To get IDs of available actions use the `GET /manage_sims/actions` endpoint.
          type: object
          properties:
            '0':
              type: array
              description: Array of Action IDs
              items:
                type: integer
            '1':
              type: array
              description: Array of Action IDs
              items:
                type: integer
            <etc>:
              type: array
              description: |
                For each additional group in the sequence or evaluation, continue this pattern for naming the keys in this object.
              items:
                type: integer
        step_names:
          description: |
            Array of strings with optional names for the groups in the simulation.  The order of the names in this array corresponds to the keys of the `steps` object in the request, so the zeroth element in this array will be the name of the group under `steps["0"]`
          type: array
          items:
            type: string
