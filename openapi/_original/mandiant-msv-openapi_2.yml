      summary: Run a Test Query for an MSI Integration
      description: |
        The values for the var_config can be blank. Depending on the test query, filters can be hardcoded. If using a query with %VARIABLES%, var_config values should be supplied in order to substitute the %VARIABLES%
      tags:
