    sectech_filter:
      name: sectechs
      in: query
      description: |
        List of security technology ids to filter results.  No parameter value means show all applicable security technologies.  This list can be obtained from `GET /security_technologies.json`
      schema:
        type: array
        items:
          type: integer
    id:
      name: id
      description: The ID of the report
      in: path
      required: true
      schema:
        type: integer
    old_time:
      name: time
      in: query
      description: Integer indicating number of days to include in the report
      schema:
        type: integer
        minimum: 1
        default: 30
    old_relationship:
      name: relationship
      in: query
      description: Whether to show relationship between blocked and detected
      schema:
        type: string
        enum:
          - 'yes'
          - 'no'
        default: 'no'
    old_show:
      name: show
      in: query
      description: |
        Which blocked actions to show, whether payload-blocked, connection-blocked, or all
      schema:
        type: string
        enum:
          - all
          - payload
          - connection
        default: all
    old_group:
      name: group
      in: query
      description: |
        Whether to group blocked actions or separate payload/connection blocked actions
      schema:
        type: string
        enum:
          - grouped
          - separate
        default: separate
  responses:
    '403':
      description: Forbidden. Not permitted to perform action
      content:
        application/json:
          example:
            error: Not permitted to perform this action
