  /action_profiles/show:
    get:
      summary: |
        List profiles for metatag actions
      tags:
        - Mitre ATT&CK Dashboard
      parameters:
        - name: dateRange
          in: query
          description: |
            Job Action time range for results, of the format `2019-08-27 04:18:42 PM UTC to 2019-09-27 04:18:42 PM UTC`
          schema:
            type: string
        - name: zones
          in: query
          description: List of Security Zones to include in the results
          schema:
            type: array
            items:
              type: string
        - name: category
          in: query
          description: String matching the Mitre ATT&CK Technique name
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                zones:
                  - Desktop Users
                  - DMZ
                times:
                  end_time: '2019-11-18T19:49:32+00:00'
                  start_time: '2019-10-20T19:49:32+00:00'
                breakdown:
                  - name: T1078
                    statistics:
                      - tag: T1078
                        sectech:
                          name: Windows Defender AV
                          id: 36
                          security_technology_id: 15
                          sectech_type: endpoint
                          tooltip: |-
                            Endpoint Product: Windows Defender AV
                            Actors: example-actor (192.168.20.22) 
                          icon: /images/logos/1/windows_defender_logo.png
                        blocked: 1
                        missed: 0
                        blocked_vids:
                          - last_job_action_id: 13374
                            last_run_time: '2019-11-18T15:51:41Z'
                            id: 3566
                            vid: A104-057
                        missed_vids: []
                        vids:
                          - A104-057
                sectech:
                  - tooltip: 'Endpoint Product: Windows Defender AV (1 product)'
                    sectech_type: endpoint
                    icon: /images/logos/1/windows_defender_logo.png
                completed:
                  missed: 1
                  blocked: 1
                name: Defense Evasion
  /action_user_profiles:
    get:
      summary: |
        List action user profiles
      tags:
        - Action user profiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                - id: 2
                  username: nodeone
                  description: ''
                  domain: ''
                  user_type: ''
                  friendly_name: Linux image user
                - id: 3
                  username: exampleusername
                  description: Example description
                  domain: exampledomain
                  user_type: User
                  friendly_name: Example Friendly Name
    post:
      summary: |
        Create an action user profile
      tags:
        - Action user profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/action_user_profile_wrapped'
            example:
              action_user_profile:
                username: exampleusername
                password: examplepassword
                user_type: User
                domain: exampledomain
                friendly_name: Example Friendly Name
                description: Example description
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 3
                username: exampleusername
                description: Example description
                created_at: '2022-10-20T19:40:34.768Z'
                updated_at: '2022-10-20T19:40:34.768Z'
                organization_id: 1
                disabled: false
                domain: exampledomain
                user_type: User
                friendly_name: Example Friendly Name
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                friendly_name:
                  - has already been taken
  /action_user_profiles/{id}:
    get:
      summary: |
        Get action user profile
      tags:
        - Action user profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 3
                username: exampleusername
                description: Example description
                created_at: '2022-10-20T19:40:34.768Z'
                updated_at: '2022-10-20T19:40:34.768Z'
                organization_id: 1
                disabled: false
                domain: exampledomain
                user_type: User
                friendly_name: Example Friendly Name
        '404':
          description: Not Found
    put:
      summary: Update an action user profile
      tags:
        - Action user profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/action_user_profile_wrapped'
            example:
              action_user_profile:
                friendly_name: Updated friendly name
      responses:
        '204':
          description: No content
          content:
            application/json:
              example: null
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                friendly_name:
                  - has already been taken
    delete:
      summary: |
        Destroy an action user profile
      tags:
        - Action user profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                result: success
        '404':
          description: Not Found
  /manage_sims/actions:
    get:
      summary: List actions
      description: |
        Return array of all active (non-deleted) Actions on the Director.
      tags:
        - Actions
      parameters:
        - name: max_attack_version
          in: query
          description: |
            If the current Director has Mitre Tactic and Technique categories loaded into its system, each response's Action object will also have a "mitre_attack_techniques" object.  This object will contain the requested version identifier as well as a list of Mitre Technique information pertaining to the Action and relevant to the Mitre ATT&CK version requested.  Any Mitre Techniques added after the given version will be filtered out of the response, as well as any Mitre Techniques that have been revoked before/within the given version.

            When this parameter is not provided, the Director will default to the highest Mitre ATT&CK version present on the Director.
            If no Mitre ATT&CK information is present on the current Director and no max_attack_version is requested, this "mitre_attack_technique" key/value pair will not be available.
            If the request stipulates a max_attack_version that is not supported by the current Director (or if the parameter is provided but no Mitre Tactic or Technique information can be located on the system) then the response will error with a 404 status and an appropriate error message with available Mitre ATT&CK versions.
          schema:
            oneOf:
              - type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                - id: 1
                  organization_id: 1
                  name: Example Action
                  desc: |
                    for API documentation
                  action_type: pcap
                  timeout_ms: 10000
                  created_at: '2020-02-10T15:09:52.672Z'
                  updated_at: '2020-02-10T15:09:52.672Z'
                  vid: A283-634
                  disabled: false
                  ver: 1
                  uuid: 5db76ba4-ed07-47a8-9d26-9fb2b9897112
                  metadata_version: 1
                  require_endpoint: false
                  approved_version: 1
                  sectech_logo_id: null
                  brt_version: 0.0.1
                  created: '2020-02-10T15:09:52.653Z'
                  required_license: null
                  runtime: null
                  notes: null
                  hex_http: false
                  min_version: null
                  sectech_url: null
                  status: null
                  decommissioned: false
                  trees:
                    - id: 103
                      name: Action on Target
                      ancestry: '97'
                      created_at: '2020-02-10T15:09:51.776Z'
                      updated_at: '2020-02-10T15:09:51.786Z'
                      organization_id: 1
                      sort_order: null
                      parent_id: 97
                      lft: 204
                      rgt: 205
                      depth: 1
                      children_count: null
                      root_name: Stage of Attack
                  verodin_tags: []
                  user_tags: []
                  os_tags: []
                  control_tags: []
                  run_as_tags: []
                  src_destination_tags: []
                  user_os_tags: []
                  user_control_tags: []
                  user_run_as_tags: []
                  user_src_destination_tags: []
                  mitre_attack_techniques:
                    version: '9.0'
                    techniques: []
    post:
      summary: Create a new Action
      description: |
        When creating an Action using the API, you must include meta-properties specific to
        the Action, properties for the type of Action, and any additional Action configuration
        properties.  The required format for the POST body depends on the action_type being created.
        The example here uses an action_type of "file_transfer" and the details for the action being
        defined are under the "file_transfer_action_attributes" key.

        All values for the action are passed under a top-level key called "sim_action".  Because
        there are several different action types that can be created from this endpoint and the
        required schema is determined by the value of the action_type key, there is a list of
        supported schemas for this endpoint.

        The available action_type values are:
          * pcap
          * hex
          * socket
          * website
          * file_transfer
          * port_scan
          * dns
          * email
          * host_cli
          * captive_dns
          * captive_ioc_url
          * cloud
      tags:
        - Actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/action_wrapped'
            examples:
              dns:
                summary: Example DNS Action Creation
                value:
                  sim_action:
                    action_type: dns
                    name: Test DNS to example.com
                    desc: Test DNS Description
                    dns_query_action_attributes:
                      dns_server_id: ''
                      domain: example.com
                      query_type: CNAME
              file_transfer:
                summary: Example File Transfer Action Creation
                value:
                  sim_action:
                    action_type: file_transfer
                    timeout_ms: '10000'
                    name: Action 1
                    desc: Action 1 Description
                    file_transfer_action_attributes:
                      file_transfer_library_id: '327'
                      compare_transfer: '1'
                      keep_after_compare: '0'
                      content_encoding: zip
                      method: get
                      app_layer: http
                      target_port: '80'
                      tunnel_cidr: 192.168.114.0
                      tunnel_protocol: dns
                      dns_domain: test.example.com
                      dns_server_ip: ''
              host_cli_action:
                summary: Example Host CLI Action Creation
                value:
                  sim_action:
                    action_type: host_cli
                    timeout_ms: '10000'
                    name: Host CLI Action
                    desc: host CLI Action Description
                    host_cli_action_attributes:
                      shell: cmd.exe
                      delivery_wait_time: 10
                      monitor_connections: 'on'
                      action_user_profile_id: ''
                      delivery_failed_result: error
                      destination_exists_result: error
                    host_cli_action_steps_attributes:
                      - id: '200'
                        step_order: 0
                        command: ipconfig
                        prompt: '>'
                        blocked_check: match
                        blocked_match: match text
                        check_events: false
                        event_logs: nil
                        sleep: 4
              cloud_action:
                summary: Example Cloud Action Creation
                value:
                  sim_action:
                    name: Cloud action w/ files
                    desc: This action demonstrates how to attach files and read them as text in an action
                    action_type: cloud
                    timeout_ms: '10000'
                    cloud_action_attributes:
                      scripts_attributes:
                        - name: setup script
                          script_text: '# do some setup here, such as creating AWS infrastructure'
                          script_type: SETUP
                          timeout: 60
                        - name: test script
                          script_text: |-
                            import logging

                            MSV_files = {}
                            for file in FILE_DEPENDENCIES:
                              file_contents = FILE_DEPENDENCIES[file].decode('utf-8')
                              MSV_files[file] = file_contents
                              logging.info('{}: {}'.format(file, file_contents))
                            logging.info('MSV_files: {}'.format(MSV_files))
                          script_type: null
                          timeout: 60
                      cloud_action_file_transfer_libraries:
                        '1':
                          variable_name: file1
                        '2':
                          variable_name: file2
                      inputs_attributes:
                        - name: aws_region
                          default_value: us-west-1
                      outputs_attributes:
                        - name: MSV_files
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                file_transfer:
                  summary: Example File Transfer Action Creation
                  value:
                    action_type: file_transfer
                    approved_version: 0
                    brt_version: 0.0.1
                    control_tags: []
                    created: '2019-11-05T22:45:40Z'
                    created_at: '2019-11-05T22:45:40Z'
                    decommissioned: false
