        target_node_id_1:
          type: string
          description: ID of the destination Actor as a string
        port_scan_mgmt_interface_1:
          type: string
          enum:
            - on off
          description: |
            Use the management interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._
        port_scan_sim_interface_1:
          type: string
          enum:
            - on off
          description: |
            Use the test interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._
        port_scan_monitor_interface_1:
          type: string
          enum:
            - on off
          description: |
            Use the monitor interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._
        port_scan_both_directions_1:
          type: string
          description: |
            Scan both directions between actors. _Note: will occur if value is present._
    action-2:
