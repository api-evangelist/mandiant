        sim_action:
          $ref: '#/components/schemas/action'
        core_updates:
          type: boolean
          description: |
            Flags Host CLI, Email, Web, and Socket Action-related PUT payloads as only containing updates for the core SimAction and particular Action Type object. Using this flag indicates that the payload will not contain any step or file dependency information fields, and will not expect changes in the step or file dependency relationships of the Action after the call has completed.
    generic_action:
      title: Generic action
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string
        target_node_id_1:
          type: string
          description: ID of the destination Actor as a string
    cloud_action-2:
      title: Cloud action
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string. There is no target actor for cloud actions
        cloud_profile_ids:
          type: object
          description: |
            A list of cloud profiles to use when running the action. 

            The key should be "1" and the value should be an array of numbers, representing a cloud profile by its ID. See the `/cloud_profiles` endpoint to get a list of valid ids. Use `null` to pass no cloud profile

            This example passes cloud profile ID 1 to the first script, and "No Profile" for the second script:
            ```json
            "cloud_profile_ids": [
              [
                [1, null]
              ]
            ]
            ```
    port_scan_action:
