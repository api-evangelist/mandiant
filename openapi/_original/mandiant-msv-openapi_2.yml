                  - OS:Windows Server:2016
                  - OS:Windows:7
                control_tags:
                  - Control:Endpoint
                run_as_tags:
                  - RunAs:Admin
                  - RunAs:SYSTEM
                src_destination_tags:
                  - Src:Internal:Trusted
                user_os_tags: []
                user_control_tags: []
                user_run_as_tags: []
                user_src_destination_tags: []
                mitre_mitigation_tags:
                  - ATT&CK:M1015
                  - ATT&CK:M1017
                  - ATT&CK:M1025
                  - ATT&CK:M1026
                  - ATT&CK:M1027
                  - ATT&CK:M1028
