components:
  schemas:
    action_user_profile:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: A user account on the Actor
        password:
          type: string
          description: Password of the user account
        description:
          type: string
          description: Description of the action user profile
        domain:
          type: string
          description: Domain controller name
        user_type:
          type: string
          description: Type of user
          enum:
            - User
            - Admin
            - Root
        friendly_name:
          type: string
          description: Human-readable identifier
    action_user_profile_wrapped:
      type: object
      properties:
        action_user_profile:
          $ref: '#/components/schemas/action_user_profile'
    action_common:
      type: object
      required:
        - name
        - desc
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of Action, must be unique
        desc:
          type: string
          description: Description of Action
    file_transfer_action_attributes:
      type: object
      required:
        - file_transfer_library_id
      properties:
        file_transfer_library_id:
          type: integer
          description: ID of Associated File Library object
        compare_transfer:
          description: Must be set to 1
        keep_after_compare:
          description: Must be set to 0
        content_encoding:
          type: string
          description: |
            File encoding, for instance "zip".  This can be blank or a comma-separated list of
            supported encoding formats like "zip,tar,gzip"
        method:
          type: string
          enum:
            - get
            - post
          description: Direction of transfer as an HTML verb
        app_layer:
          type: string
          enum:
            - http
            - ftp
            - https
            - scp
            - ''
          description: Application layer for tunnel.  Can be an empty string to indicate no tunnel.
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
        tunnel_cidr:
          type: string
          description: IP Address for CIDR tunnel.  Required for all tunnels
        tunnel_protocol:
          type: string
          enum:
            - dns
            - icmp
            - ssh
            - null
          description: Tunneling protocol.  Can be blank.
        dns_domain:
          description: |
            DNS Domain.  This is only needed when defining a DNS tunnel file transfer
        dns_server_ip:
          description: |
            DNS Server IP address.  Optional and only applies to DNS tunnels.
    file_transfer_action:
      type: object
      required:
        - action_type
        - file_transfer_action_attributes
      properties:
