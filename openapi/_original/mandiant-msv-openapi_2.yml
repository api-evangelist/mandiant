      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |
                Required for integration types that use a query
              required:
                - query
                - var_config
              properties:
                query:
                  type: string
                var_config:
                  type: object
                  properties:
                    ips:
                      type: array
                      items:
                        type: string
                    hostnames:
                      type: array
                      items:
                        type: string
                    domains:
                      type: array
                      items:
                        type: string
                    email_senders:
                      type: array
                      items:
                        type: string
                    email_recipients:
                      type: array
                      items:
                        type: string
                    user_accounts:
                      type: array
                      items:
                        type: string
                    start_time:
                      type: string
                    end_time:
                      type: string
            example:
              query: |-
                {
                  "query": {
                    "query_string": {
                      "query": "(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]"
                    }
                  }
                }
              var_config:
                hostnames:
                  - actor
                start_time: '2025-05-14T20:23:04.668Z'
