    alert_format:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
          description: |
            Message for the content of the notification.  Must be a string.  You can include placeholders in the message to be replaced with the attributes of the individual monitor.  These are the available placeholders:

              %monitor_def_id%
              %monitor_def_name%
              %monitor_def_desc%
              %monitor_result_id%
              %monitor_result_state_change_timestamp%
              %monitor_result_failed%
              %sequence_id%
              %sequence_vid%
        alert_type:
          type: string
          enum:
            - email
            - syslog
          description: String indicating type of notification
        syslog_severity:
          type: string
          enum:
            - emerg
            - alert
            - crit
            - err
            - warning
            - notice
            - info
            - debug
          description: Required if alert_type is syslog
        from_address:
          type: string
          description: Required if alert_type is email
        subject:
          type: string
          description: Required if alert_type is email
    alert_format_wrapped:
      type: object
      properties:
        alert_format:
          $ref: '#/components/schemas/alert_format'
    alert_profile:
      type: object
      properties:
        name:
          type: string
        action_type:
          type: string
          enum:
            - monitor_run
            - monitor_fail
            - monitor_state_change
            - detection_change
            - detection_count_change
            - detection_increase
            - detection_decrease
          description: Monitor result that triggers notification
        alert_format_ids:
          description: |
            IDs of related Notification Format for this Notification Profile.  The list of available Notification Formats can be retrieved from the `GET /alert_formats` endpoint.
          type: array
          items:
            type: integer
        max_alerts:
          type: integer
          minimum: 1
          description: Maximum number of alerts for time period
        max_alerts_interval:
          type: string
          enum:
            - minute
            - hour
            - day
            - week
          description: |
            Time period type, used with the max_alerts value to indicate how many notifications can be sent within a given timeframe.  For example, a `max_alerts` value of 30 and a `max_alerts_interval` value of `hour` would mean this notification would be sent not more than 30 times per hour
        monitor_def_ids:
          description: |
            IDs of related Monitor Defs for this Notification Profile. The list of available Monitor Defs can be retrieved from the `GET /monitor_defs` endpoint.
    alert_profile_wrapped:
      type: object
      properties:
        alert_profile:
          $ref: '#/components/schemas/alert_profile'
