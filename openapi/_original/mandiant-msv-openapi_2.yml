          type: string
          enum:
            - in
            - not in
            - and
            - or
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/tuple'
        match_object:
          type: string
          enum:
            - action
            - job
            - evaluation
            - sequence
            - monitor
            - threat_actor
            - source_actor
            - destination_actor
            - actor
            - source_zone
            - destination_zone
            - zone
            - blocking_security_technology
            - detecting_security_technology
          description: |
            # 
            This is the object that the query should be evaluated upon for this conditional
        match_field:
          type: string
          enum:
            - job
            - tags
            - id
            - attack_tactic
            - nist_800_53_control_id
            - controls
            - results
            - action_type
            - nist_800_53_control_family_id
            - nist_800_53_priority
          description: |
            #
            This is the field on the object the user is querying about in this conditional.  
            All field usage is predicated on that field being available on the match object in the conditional.
            | match_object | Permitted match_field entries |
            |--------------|-------------------------------|
            | `action` | `tags` <br/> `attack_tactic` <br/> `controls` <br/> `nist_800_53_control_id` <br/> `results` <br/> `action_type` <br/> `nist_800_53_control_family_id` <br/> `nist_800_53_priority` |
            | `evaluation` <br/> `sequence` | `tags` |
            | `monitor` <br/> `threat_actor` <br/> `source_zone` <br/> `destination_zone` <br/> `zone` <br/> `blocking_security_technology` <br/> `detecting_security_technology` | `id` |
            | `job` <br/> `source_actor` <br/> `destination_actor` <br/> `actor` | `id` <br/> `tags` |
        value:
          type: string
          description: |
            #
            This is a freeform field used to compare to the match object/match field in the user's conditional.
            Some of the values in this parameter are dependent on the match_object/match_field tuple query.
            - If the user queries on match_object `action` and match_field `results`, the value should be one of `prevented`, `missed`, `detected`, `alerted`, or `errored`.
            - On the other hand, if the user queries on match_object `job` and match_field `id`, then the value parameter would be the string representation of any numerical id ("75559", for example)
    time:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
