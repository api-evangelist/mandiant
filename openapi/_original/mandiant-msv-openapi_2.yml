  /manage_sims/actions/{id}.json:
    get:
      summary: Lookup Action info by ID or VID
      description: |
        Get action info by either the Action ID or VID
        * The `lookup_type` can be left off, in which case the path ID will default to the Action ID, such as `/manage_sims/actions/323.json`.  
        * If `lookup_type` is provided and set to the Action VID, then the path ID will be expected to be a VID instead, such as `/manage_sims/actions/A104-167.json?lookup_type=vid`.  
      tags:
        - Actions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The action ID to lookup. If `lookup_type` is vid, this should be the vid.
        - in: query
          name: lookup_type
          schema:
            type: string
            enum:
              - id
              - vid
            default: id
          description: Determines how to do the lookup. If nothing is specified, ID is assumed
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                sim_action:
                  id: 647
                  organization_id: 1
                  name: Test Action
                  desc: For API documentation
                  action_type: host_cli
                  timeout_ms: 10000
                  created_at: '2021-08-26T06:15:01.489Z'
                  updated_at: '2021-08-26T06:15:01.521Z'
                  vid: A104-052
                  disabled: false
                  ver: 14
                  uuid: 18e7d573-e0d6-48da-97c4-201ddd48ed8a
                  metadata_version: 31
                  require_endpoint: false
                  approved_version: 14
                  sectech_logo_id: null
