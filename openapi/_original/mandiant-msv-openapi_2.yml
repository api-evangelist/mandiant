        Response will be the system backup file.  Depending on the specific data on Director, this API endpoint can take a while to complete.
      tags:
        - Settings
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                status: success
                message: Backup generation process successfully initiated.
                backup_id: 3
                created_at: Tue, 11 Jul 2023 19:27:09 UTC
  /settings/backup_download/{id}.json:
    get:
      summary: Download a backup once it has been generated.
      description: |
        Download a backup generated using `GET /settings/create_backup`
      tags:
        - Settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The backup ID returned in the `/settings/create_backup` call
      responses:
        '200':
          description: Success
  /settings/restore_backup:
    post:
      summary: Restore Director from a system backup
      description: |
        Upload a file created using `GET /settings/create_backup` and obtained from the `GET /settings/backup_download` endpoint under the param `restore_file`.  Because the restore process restarts Apache, a successful restore will usually get an empty reply back from the server rather than a 200 response.
      tags:
        - Settings
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                restore_file:
                  description: |
                    Backup file from create_backup to use for the restore
                  type: string
                  format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: null
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                result: error
                notice: Error restoring backup, please upload a valid file
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                result: error
                notice: 'Error restoring backup: <example error>'
