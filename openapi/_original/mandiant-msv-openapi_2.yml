          description: |
            ID of attacker Actor if step is run between actors.  Replace <num> with the order of the step, starting at 1.
        target_node_id_step_<num>:
          type: integer
          description: |
            ID of target Actor if step is run between actors. Replace <num> with the order of the step, starting at 1.
        attack_zone_id_step_<num>:
          type: integer
          description: |
            ID of attacker Security Zone if step is run between zones
        target_zone_id_step_<num>:
          type: integer
          description: |
            ID of target Security Zone if step is run between zones
        monitor_def_datetime:
          type: string
          description: |
            Date and time of first run of the monitor.  Must be a string in a format like: `2016/09/01 17:14 UTC`
        repeat_job_period_number:
          type: integer
          minimum: 1
          description: |
            Number indicating how often to repeat monitor
        repeat_job_period_type:
          type: string
          enum:
            - seconds
            - minutes
            - hours
            - days
          description: |
            String indicating how repeat_job_period_number parameter is interpreted
