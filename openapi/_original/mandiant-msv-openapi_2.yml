        - Actions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the action to run.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/action-2'
            examples:
              action:
                summary: Generic action
