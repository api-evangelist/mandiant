openapi: 3.0.3
info:
  title: Mandiant Security Validation (MSV) - Director API
  version: 4.14.7.0
tags:
  - name: Introducing the MSV API
    description: |
      Application Programming Interfaces (“APIs”) define interfaces to programming libraries or frameworks for accessing functionality provided by the library or framework. The MSV API follows the principles of Representational State Transfer (“REST”) and provides methods for accessing every feature, such as creating MSV Actors, scheduling Sequences and Evaluations, and editing SIEM integrations among other functions.

      ### Entry Format

      Each URI/endpoint described in this Guide includes a number of attributes, including those identified in the table below.

      | Attribute | Description |
      |-----------| ----------- |
      | Access Method | Methods supported for the endpoint, such as GET (read), POST (create/update), PUT, and DELETE (delete)
      | URI | Endpoint descriptions use the URI as the endpoint name
      | Parameters | Supported request parameters such as datatype or default values
      | Return Structure | Response or HTTP status code

      ### Viewing Documentation on Director

      Up-to-date documentation is available on the Director itself at `https://[directorIP]/apidoc`, which is reachable from the UI under the User menu in the top navigation bar.
  - name: Connection & Authentication
    description: |
      For access to the MSV API, there are two authentication mechanisms you can use.  First, you can use basic authentication including username and password over HTTPS, with a connection on port 443.

      For example:

      ```
      curl –-user "username:password" https://[directorIP]/topology/nodes.json
      ```

      Note that if your password contains special characters that are interpreted by the shell you're using, then you'll need to escape them in the `--user` argument.  If you are using a self-signed SSL certificate, you'll need to use the `-k` option to allow `curl` to accept the cert.

      Second, you can use an API Key that is tied to your account.  You can generate/regenerate/clear API Keys in User Preferences under the User menu in the Director interface.  The API Key is passed in an Authorization header in the format: "Bearer API_KEY", so for example if your API Key was q6kzPy7JrbAxbAer9VEL, then your Authorization header would be `Bearer q6kzPy7JrbAxbAer9VE`

      To build on the curl example from above, for API Key authorization, the curl command would look like this:

      ```
      curl –H "Authorization: Bearer q6kzPy7JrbAxbAer9VEL" https://[directorIP]/topology/nodes.json
      ```
  - name: Supported HTTP Methods
    description: |
      The MSV API supports the standard HTTP methods, including GET, POST, and DELETE. In general, GETs are used to query for particular data, POSTs are used to create or update data, and DELETEs are used to remove data from the platform. Where applicable, contextual elements or parameters must be URI encoded.
  - name: HTTP Status Codes
    description: |
      MSV leverages standard HTTP status codes as responses for many of its API-accessible operations as detailed in the table below.

      | Status Code | Description |
      |------------ | ----------- |
      | 200 | Request completed successfully
      | 201 | Create request completed successfully
      | 204 | No content
      | 400 | Bad Request. See response body for details.
      | 401 | Authentication failure, invalid access credentials.
      | 403 | Forbidden, insufficient permissions
      | 404 | Requested URI does not exist or resource wasn't found
      | 409 | Invalid operation
      | 500 | Unspecified internal server error
      | 503 | Feature is disabled in configuration file
  - name: API Formats
    description: |
      Most MSV API endpoints respond to both JSON and XML formats. To specify which format, append .json or .xml at the end of the URL. To avoid making this document unnecessarily verbose, Most of the example requests and responses for each API endpoint will be in JSON. The example below shows what a JSON and XML response looks like for the same API call:

      ```
      Request:
        GET /security_zones/396.json

      Response:
        Status: 200
        
        {
          "created_at": "2016-09-07T19:11:12Z",
          "desc": "Default Internet zone",
          "disabled": false,
          "id": 396,
          "name": "Internet",
          "organization_id": 1,
          "updated_at": "2016-09-07T19:11:12Z"
        }
      ```

      ```
      Request:
        GET /security_zones/396.xml

      Response:
        Status: 200

        <?xml version="1.0" encoding="UTF-8"?>
        <security-zone>
          <created-at type="datetime">2016-09-07T19:11:12Z</created-at>
          <desc>Default Internet zone</desc>
          <disabled type="boolean">false</disabled>
          <id type="integer">396</id>
          <name>Internet</name>
          <organization-id type="integer">1</organization-id>
          <updated-at type="datetime">2016-09-07T19:11:12Z</updated-at>
        </security-zone>
      ```
  - name: Notes
    description: |
      General notes and clarifications regarding API calls are below.

      * Some areas of the documentation and within the API itself still refer to the Director as Planner. This will be corrected in an upcoming release.
      * Some areas of the documentation and within the API itself still refer to Actors as Nodes. This will be corrected in an upcoming release.
      * Sequences and Evaluations are referred to as “simulations” in existing API calls
      * ID and VID are two different attributes
      * To gather Action ID numbers, use the `GET /manage_sims/actions.json` call to get a list of all Actions and their respective attributes
      * To gather Evaluation and Sequence ID numbers, use `GET /simulations.json?sim_type=sequence` for Sequences and `GET /simulations.json?sim_type=eval` for Evaluations to get lists of their respective attributes
  - name: Audit Logs
    description: |
      The Validation Platform Director has a consolidated audit log that tracks Validation Platform activity. As a general overview, the type of data in the Audit log is captured below. Each record is categorized using a Section and Action Type.

      For a list of Section and Action Type values, see Audit Log Record Categorization. Some of the types of data it captures includes:

      * Security Content changes: Creating, Updating, and Deleting Actions, Sequences, Evaluations, Files
      * Director changes: Updating admin settings; updating network devices; adding, updating, removing notifications
      * Instructions sent to the Actors: Check time sync, check version
      * User Access: Login, Logout, Authentication failures
      * Running Jobs
      * Integrations: Adding, updating, removing Integrations
      * User Actions: Users accessing reports
  - name: Action user profiles
    description: |
      Action User Profiles allow running certain types of actions as other users.  For example, to run a Host CLI action as a non-System or non-root user, you would configure an Action User Profile and select it when running an action
  - name: Actions
    description: |
      Actions are the smallest units MSV uses and simulate suspicious or malicious network traffic. They can be combined to form Sequences and Evaluations.
  - name: Actors
  - name: Analyze
  - name: Bulk Jobs
    description: |
      Bulk jobs can be created from a single Action with a list of source and
      destination tags.
  - name: Cloud Profiles
    description: |
      Cloud profiles provide a secure way to use credentials when running cloud actions. They are made available in your scripts as environment variables. Once entered, sensitive fields (such as secret keys) and any custom values will not show up in the UI or API and are encrypted at rest.
  - name: DNS Servers
    description: |
      DNS Servers provide addresses for actors to use as DNS servers in DNS query actions.  Individual DNS query actions can specify one of the available DNS servers.
  - name: Email Profiles
    description: |
      Email Profiles provide the valid email addresses and email servers that are used to send files for email file transfer actions.
  - name: Email rules
    description: |
      Rules to use when determining the results of Email Actions
  - name: Event Filter Rules
    description: |
      The suppressed event filter rule API endpoints interact with the rules governing an event matching a Job Action.

      An suppressing or dropping EventFilterRule will prevent an Integration event from having a normal relationship with a Job Action.  A suppressed or dropped event will not contribute
      to the prevented/alerted/detected/missed set of statistics for a Job Action.  The event's relationship will be considered suppressed or
      dropped depending on the rule configuration and the global Director settings.

      A kept EventFilterRule will override suppressing or dropping rules depending on the numerical priority.  This can be used to establish "normal" or expected
      event matching behavior.  For example, a priority 5 rule to suppress all events from Host CLI actions can be overridden by a priority 3 rule
      to keep all events from a particular Integration.

      A Suppressing or Dropping EventFilterRule differ from a normal IntegrationEventFilter in the way the event and the Job Action relate to each other.
      * Events that are Suppressed or Dropped via EventFilterRules and not by IntegrationEventFilters will not contribute any statistics to the Job Action, the event will not be considered a "real" event for the Job Action, and
      the only record that the event has any relationship at all to the Job Action is that there will be a SuppressedEvent/DroppedEvent object created and attached to the Job Action
      afterward.
      * Events that are altered by the IntegrationEventFilter and not by EventFilterRules will still be considered "real" events attached to the Job Action, however the event
      cannot be considered "detected" by the Job Action.
      * Events that are eligible to be Suppressed or Dropped by an EventFilterRule but also eligible to be altered by an IntegrationEventFilter will be Suppressed or Dropped only.
      The event will not be linked to the Job Action and therefore will not be considered detected (or prevented or missed or anything)
  - name: Event Suppression
    description: |
      The suppressed event API endpoints provide accessors to suppress and drop events.
  - name: File Library
    description: File Library objects that can be attached to Actions.
  - name: Integration API Tokens
    description: |
      Tokens to use when authenticating with the Integrations API.  When being used, the token must be in the Authorization header as a bearer token like "Authorization: Bearer abc123"
  - name: Integration Events
    description: |
      Events that came from an integration configured on the Director.  This does not include events that come from local logs for Host CLI Actions.
  - name: Integrations
  - name: Job Actions
    description: |
      The result of running an action as part of a simulation. Belongs to a Job
  - name: Jobs
    description: |
      Jobs are the results of Actions, Evaluations, or Sequences that have been run.  They contain JobSteps and JobActions
  - name: Mitre ATT&CK Dashboard
    description: |
      ActionProfiles are statistical actions based on a metatag.
  - name: Monitor Definitions
    description: |
      Sequences or Evaluations that run periodically and generate notifications depending on result
  - name: Monitor groups
    description: |
      Groups to contain multiple Monitor Definitions
  - name: Monitors
    description: |
      Sequences or Evaluations that run periodically and generate notifications depending on result
  - name: NTP Servers
    description: |
      NTP Servers allow you to provide server addresses for actors to use to synchronize their time
  - name: Notification formats
    description: |
      Monitors generate notifications of two different formats: email and syslog.  Notification formats let you customize the messages sent when a monitor creates a notification.
  - name: Notification profiles
    description: |
      Notification profiles allow you to configure which monitors produce notifications and under what conditions the notification is sent.
  - name: Proxy Rules
    description: |
      Proxy Rules specify proxies to use for MSV traffic.
  - name: Report Builder
    description: |
      A collection of API endpoints to help automate report creation
  - name: Reports
    description: |
      Reports are the finished product of system interactions.
      Behaviors are the possibly-nested umbrella for job actions.
      Zones are the pseudological encapsulation of areas of influence in the system.
      SecTech are the types of security technologies implemented by the system.
  - name: Search
  - name: Security technologies
  - name: Security zones
    description: |
      Security Zones are regions within the network that contain actors and can be considered as being Internal or External.  Each actor must belong to exactly one Security Zone.
  - name: Security zone attributes
    description: |
      Security Zone attributes are descriptors added to Security Zones.  Attributes determine whether a zone's location is internal or external and influence Source and Destination recommendations for Actions.
  - name: Settings
    description: |
      The Settings are used for Director-specific alterations to your organizations installation.

      <h2>Handling Content Backups</h2>
      Creating and using a data backup involves calling a few Setting endpoints in sequence.  Visit each endpoint for argument and usage details:

      | Endpoint | Description |
      |----------|-------------|
      | `/settings/create_backup` | Start the backup process. |
      | `/settings/backup_download` | Download the backup once it has been generated. |
      | `/settings/restore_backup` | Upload and apply a system backup to the Director. |
  - name: Sequences and Evaluations
    description: |
      Sequences and evaluations can have one or more steps, each containing one or more actions.  Each step of a sequence or evaluation can be run between different actors, but all the actions within a single step must run between the same actors.  Sequences typically represent a complete network attack and Evaluations are often groups of similar actions.
  - name: Topology
    description: |
      The topology API endpoints provide information about Actors, Security Zones, and the connections between them.
  - name: Users
    description: |
      Users are individuals belonging to an Organization.  Each user belongs to a UserGroup which determines their privileges.
  - name: User Groups
    description: |
      User Groups are collections of Users with similar privileges and that all belong to the same Organization.
paths:
  /audit_logs/table_data:
    get:
      summary: List audit log entries
      description: |
        List audit log entries, filterable using the parameters listed below.

        To map header names to numbers used in the `col` and `filterList` params, refer to the `headers` portion of the response. For example, `filterList[0]` would refer to the ID header, while `filterList[4]` would refer to Action Type.
      tags:
        - Audit Logs
      parameters:
        - name: page
          in: query
          description: The page, starting from 0
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: How many results to return in a page
          schema:
            type: integer
            default: 50
        - name: col
          in: query
          description: |
            Specify which header column to sort by.

            For example, to sort by the date/time the entry occurred you can specify `col[1]=0` to sort in chronological order or `col[1]=1` to sort in reverse chronological order (using the Timestamp column)
          schema:
            type: object
        - name: filterList
          in: query
          description: |
            Specify which columns to filter by. Multiple filters can be used and will be combined using AND logic.

            Here's an example of filtering by `section` and `action_type` to show failed logins:
            ```
              "filterList": {
                "3": "sessions",
                "4": "login_failure"
              }
            ```

            An exhaustive list of sections and action_types are available at https://docs.mandiant.com/home/msv-audit-log-record-categorization

            More examples and use cases are available in the Request and Response examples.
          schema:
            type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                last_5_logs:
                  summary: Last 5 logs
                  value:
                    headers:
                      - ID
                      - Timestamp
                      - Ran By
                      - Section
                      - Action Type
                      - Message
