    event_filter_rule_base:
      type: object
      properties:
        priority:
          type: integer
          description: Priority of rule.  A lower number marks the rule as a greater relative priority - for example, a priority 2 rule will be executed over a priority 5 rule.
        determination:
          type: string
          enum:
            - drop
            - suppress
            - keep
          description: |
            The effect of an event matching a rule.

            **Drop** will prevent saving the event for reference to this Job Action (the event may be saved if it matches another Job Action).  The event 
            UUID will be added to a record of dropped event information and added to the Job Action, but the event itself will not be related to the Job Action.

            **Suppress** will save the event but will not relate the event to the Job Action.  The data about the relationship between the event
            and the Job Action will be saved and stored.  Suppressed Events can be converted back to Job Action events at a later date.

            **Keep** determinations will force the event to be related to the Job Action, overriding the Suppress and Drop rules of numerically
            higher-priority rules.  For instance, a Keep rule with priority 5 will persist an event, even if that event would normally
            be Suppressed with a rule that has a priority of 7.  A suppress rule with a priority of 3 would still suppress the event.
        override_settings:
          type: boolean
          description: |
            When true, the rule's determination will override the global determination of rule activity.  This only impacts rules involving **Suppress** or **Drop**.

            For example, if the Director is set to globally **Suppress** all non-**Keep** rules, but you know you want to update the rule to 
            force a **Drop** of matching events, this parameter should be set to `true`.

            Conversely, if you want to update the rule to follow the Director global guidelines, you can pass this parameter with the `false` value.
        filter_condition_attributes:
          type: array
          items:
            type: object
            properties:
              match_object:
                type: string
                enum:
                  - SimAction
                  - Integration
                  - IntegrationEvent
                description: The type of object that the rule will look to match
              match_field:
                type: string
                description: |
                  The attribute on the match_object that will be called for evaluation.  The list of effective fields can be obtained from `/event_filter_rules/rule_options.json`

                  For the SimAction, this includes **vid** and **action_type**.
                  For the Integration, this includes **id** and **type**.
                  For the IntegrationEvent, this includes many of the attributes of an IntegrationEvent, excluding time-related attributes.
              operator:
                type: string
                enum:
                  - in
                  - not_in
                  - contains
                  - not_contains
                description: The match type for the rule value when comparing with the match_object and match_field.  **in** and **not_in** will match for an array match_field response, while **contains** and **not_contains** are designed to perform comparisons for a string match_field response.
              match_value:
                type: string
                description: |
                  The target value for rule matching.

                  For example, a filter condition with match_object of "SimAction", match_field of "vid", operator of "not_in", and match_value of "A100-100" will
                  match all SimActions other than the SimAction with a VID of A100-100.
    event_filter_rule_create_payload:
      allOf:
        - $ref: '#/components/schemas/event_filter_rule_base'
  parameters:
    type_filter:
      name: type
      in: query
      required: true
      schema:
        type: string
    time_range:
