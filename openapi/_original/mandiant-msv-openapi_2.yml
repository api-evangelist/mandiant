  /suppressed_events/suppress:
    post:
      summary: |
        Suppress the given Job Action events.
      description: |
        Suppress already-created Job Action events.  Events cannot be suppressed within the operational window where events are still being matched with Job Actions
        (typically 15 minutes from when the Job Action has been executed).

        The response object will be an array of all Suppressed Events created from this operation.
      tags:
        - Event Suppression
      parameters:
        - name: ja_event_ids
          description: |
            The list of Job Action event IDs that will be converted to Suppressed Events.  These original Job Action events will be deleted from the system.
          in: query
          required: true
          schema:
            type: string
          example: 15, 18, 23
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                - id: 11
                  job_action_id: 70
                  integration_event_id: 48
                  organization_id: 1
                  created_at: '2021-09-09T20:53:30.358Z'
                  updated_at: '2021-09-09T20:53:30.358Z'
                  event_filter_rule_id: null
                  integration_id: 2
  /suppressed_events/drop:
    post:
      summary: |
        Drop the given Job Action events
      description: |
        Drop already-created Job Action events.  Events cannot be dropped within the operational window where events are still being matched with Job Actions
        (typically 15 minutes from when the Job Action has been executed). 

        The response object will be an array of all Dropped Events created from this operation.
      tags:
        - Event Suppression
      parameters:
        - name: ja_event_ids
          description: |
            The list of Job Action event IDs that will be converted to Dropped Events.  These original Job Action events will be deleted from the system.
            The related Integration events will also be deleted unless they are connected to other Job Actions.  Dropped events will not be able to be 
            converted back into Job Action events at a later date.
          in: query
          required: true
          schema:
            type: string
          example: 43
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                - id: 136
                  uid: 1dbb542d2300a2133b551dc964c26c15a057ea882025e0d8f2d478921e1b482a
                  event_filter_rule_id: null
                  created_at: '2021-09-09T20:48:59.782Z'
                  updated_at: '2021-09-09T20:48:59.782Z'
                  integration_id: 2
                  job_action_id: 71
                  organization_id: 1
