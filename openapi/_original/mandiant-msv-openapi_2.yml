  /settings/content_export:
    post:
      summary: Export content from the Director
      description: |
        Content can be filtered by specific VIDs, content type, and approval status.
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pending:
                  description: |
                    Takes one of two values.
                    * `prevent` will prevent the export if any content is unapproved;
                    * `always` will ignore approval checks and export regardless
                  type: string
                  default: prevent
                  enum:
                    - always
                    - prevent
                content_export:
                  description: |
                    The type of content to export
                    * `all` - All content
                    * `all_custom` - All custom content
                    * `actions` - Actions only, no Sequences / Evals
                    * `actions_custom` - Custom actions only, no Sequences / Evals
                    * `vid` - Specific content by VID. Must also include `content_vids` parameter
                  type: string
                  enum:
                    - all
                    - actions
                    - actions_customer
                    - all_custom
                    - vid
                content_vids:
                  description: |
                    Specify content VIDs, separated by comma. Only necessary when content_export is `vid`.

                    example: `"A100-001,A100-002"`
                  type: string
              required:
                - content_export
            examples:
              All content, ignoring approval status:
                value:
                  pending: always
                  content_export: all
              All approved custom content:
                value:
                  pending: prevent
                  content_export: all_custom
              Specific content by VID:
                value:
                  pending: always
                  content_export: vid
                  content_vids: A104-325,A104-323
      responses:
        '200':
          description: Returns a .vas file containing the exported content
          content:
            application/octet-stream:
              schema:
