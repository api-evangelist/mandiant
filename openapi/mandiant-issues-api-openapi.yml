      summary: Set Status
      description: 'Set status on an individual entity. The body takes a json input with a single ''status'' field.


        Values for Payload status:


        - open_new

        - open_triaged

        - open_in_progress

        - closed_resolved

        - closed_duplicate

        - closed_out_of_scope

        - closed_benign

        - closed_risk_accepted

