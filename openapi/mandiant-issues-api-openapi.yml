                type: string
                example: Origin
            Content-Length:
              schema:
                type: integer
                example: '3908'
            Via:
              schema:
                type: string
                example: 1.1 vegur
          content:
            application/json:
              schema:
                type: object
              example:
                success: true
                message: Search completed!
                result:
                  search:
                    search_body:
                      query:
                        bool:
