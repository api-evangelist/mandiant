          '
      - name: search_string
        in: path
        schema:
          type: string
        required: true
        description: Example with multiple keywords. If no string is entered all issues for the project will be returned
        example: collection:collectionname_a6mz56o first_seen_after:2022-01-01 last_seen_before:last_refresh
      responses:
        '200':
          description: OK
          headers:
            Server:
              schema:
                type: string
                example: Cowboy
            Date:
              schema:
                type: string
                example: Fri, 17 Feb 2023 22:17:48 GMT
            Connection:
              schema:
                type: string
                example: keep-alive
            Content-Type:
              schema:
                type: string
                example: application/json
            X-Content-Type-Options:
