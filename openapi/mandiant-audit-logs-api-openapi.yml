info:
  title: Mandiant Audit Logs API
  version: '1.0'
  description: 'Operations tagged Audit Logs across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Audit Logs
  description: 'The Validation Platform Director has a consolidated audit log that tracks Validation Platform activity. As a general overview, the type of data in the Audit log is captured below. Each record is categorized using a Section and Action Type.


    For a list of Section and Action Type values, see Audit Log Record Categorization. Some of the types of data it captures includes:


    * Security Content changes: Creating, Updating, and Deleting Actions, Sequences, Evaluations, Files

    * Director changes: Updating admin settings; updating network devices; adding, updating, removing notifications

    * Instructions sent to the Actors: Check time sync, check version

    * User Access: Login, Logout, Authentication failures

    * Running Jobs

    * Integrations: Adding, updating, removing Integrations

    * User Actions: Users accessing reports'
paths:
  /audit_logs/table_data:
    get:
      summary: List audit log entries
      description: 'List audit log entries, filterable using the parameters listed below.


        To map header names to numbers used in the `col` and `filterList` params, refer to the `headers` portion of the response. For example, `filterList[0]` would refer to the ID header, while `filterList[4]` would refer to Action Type.'
      tags:
      - Audit Logs
      parameters:
      - name: page
        in: query
        description: The page, starting from 0
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: How many results to return in a page
        schema:
          type: integer
          default: 50
      - name: col
        in: query
        description: 'Specify which header column to sort by.


          For example, to sort by the date/time the entry occurred you can specify `col[1]=0` to sort in chronological order or `col[1]=1` to sort in reverse chronological order (using the Timestamp column)

          '
        schema:
          type: object
      - name: filterList
        in: query
        description: "Specify which columns to filter by. Multiple filters can be used and will be combined using AND logic.\n\nHere's an example of filtering by `section` and `action_type` to show failed logins:\n```\n  \"filterList\": {\n    \"3\": \"sessions\",\n    \"4\": \"login_failure\"\n  }\n```\n\nAn exhaustive list of sections and action_types are available at https://docs.mandiant.com/home/msv-audit-log-record-categorization\n\nMore examples and use cases are available in the Request and Response examples.\n"
        schema:
          type: object
