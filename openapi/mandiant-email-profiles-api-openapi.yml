  /settings/email_profiles/{id}:
    get:
      summary: Show an email profile
      tags:
      - Email Profiles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The ID of the email profile to lookup.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 4
                organization_id: 29
                server_address: mail.verodin.com
                account_username: testing@verodin.com
