      operationId: getSettingsEmailProfiles
      x-operation-id-source: derived
    post:
      summary: Create an email profile
      tags:
      - Email Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/email_profile_wrapped'
            example:
              email_profile:
                account_password: password
                account_username: erich_corkery@funk.name
                email_address: erich_corkery@funk.name
