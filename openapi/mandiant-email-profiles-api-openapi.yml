openapi: 3.2.0
info:
  title: Mandiant Email Profiles API
  version: '1.0'
  description: 'Operations tagged Email Profiles across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Email Profiles
  description: Email Profiles provide the valid email addresses and email servers that are used to send files for email file transfer actions.
paths:
  /settings/email_profiles:
    get:
      summary: List email profiles
      tags:
      - Email Profiles
