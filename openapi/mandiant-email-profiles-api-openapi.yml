      operationId: getSettingsEmailProfilesById
      x-operation-id-source: derived
components:
  schemas:
    email_profile:
      type: object
      properties:
        account_password:
          type: string
          description: Password for email account
        account_username:
          type: string
          description: Valid email address for profile
        associated_node_ids:
          description: 'IDs for actors to be associated with this Email Profile. Must be an array of integers.

            '
        server_address:
          type: string
          description: Hostname or IP address of email server.
        server_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port to use for the incoming email server
        server_smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port to use for the SMTP server
        server_type:
          type: string
          enum:
          - pop3
          - pop3_ssl
          - imap
          - imap_ssl
          - imap_starttls
          description: String indicating type of incoming email server
    email_profile_wrapped:
      type: object
      properties:
        email_profile:
          $ref: '#/components/schemas/email_profile'
