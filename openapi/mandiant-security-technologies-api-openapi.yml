openapi: 3.2.0
info:
  title: Mandiant Security technologies API
  version: '1.0'
  description: 'Operations tagged Security technologies across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Security technologies
paths:
  /topology/security_technologies.json:
    get:
      summary: List Security Technologies
      description: Return security technology, network devices, and endpoint product information
      tags:
      - Security technologies
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                network_devices:
                - disabled: false
                  prevention_enabled: Enabled
                  security_technology_id: 1000
                  updated_at: '2019-05-17T18:59:38.930Z'
                  created_at: '2019-05-17T18:27:28.085Z'
                  organization_id: 1
                  description: New Network Device
                  name: My Network Device
                  id: 1
                endpoint_products:
                - disabled: false
                  prevention_enabled: Enabled
                  updated_at: '2020-03-10T18:58:07.390Z'
                  created_at: '2020-03-10T18:58:07.390Z'
                  log_sources: {}
                  security_technology_id: 500
                  organization_id: 1
                  description: New Endpoint Product
                  name: My Endpoint Product
                  id: 1
                security_technologies:
                - logo_path_for_web: /images/logos/1/my_sectech.png
                  sectech_logo_id: 100
                  updated_at: '2018-12-13T01:04:19.193Z'
                  created_at: '2018-12-13T01:04:19.191Z'
                  organization_id: 1
                  priority: null
                  sectech_type: endpoint
                  discovery_enabled: null
                  version: null
                  product_type: Antivirus
                  product: My Antivirus
                  vendor: Fireeye
                  id: 1
                - logo_path_for_web: /images/logos/1/my_sectech.png
                  sectech_logo_id: 75
                  updated_at: '2019-06-17T14:16:36.760Z'
                  created_at: '2019-05-17T18:27:28.079Z'
                  organization_id: 1
                  priority: null
                  sectech_type: network
                  discovery_enabled: null
                  version: null
                  product_type: Proxy
                  product: New Proxy
                  vendor: My Proxy
                  id: 2
      operationId: getTopologySecurityTechnologiesJson
      x-operation-id-source: derived
  /security_technologies/validate_config:
    post:
      summary: Check the validity of a config against our schema
      tags:
      - Security technologies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/config_submit'
            example:
              config: '[{"type":"network","technology":{"logo":"suricata_logo_2.png","product":"Suricata","version":"3.1.3","tech_type":"IDS","vendor":"Suricata"},"discovery":{"arcsight":[{"type":"field","field":"Agent Name","value":"suricata"}]}}]'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                valid: true
      operationId: postSecurityTechnologiesValidateConfig
      x-operation-id-source: derived
  /security_technologies/config:
    post:
      summary: Update Security Technology config
      description: This updates the customer-defined Security Technology config file
      tags:
      - Security technologies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/config_submit'
            example:
              config: '[{"type":"network","technology":{"logo":"suricata_logo_2.png","product":"Suricata","version":"3.1.3","tech_type":"IDS","vendor":"Suricata"},"discovery":{"arcsight":[{"type":"field","field":"Agent Name","value":"suricata"}]}}]'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                valid: true
                result: success
      operationId: postSecurityTechnologiesConfig
      x-operation-id-source: derived
  /security_technologies/download_config:
    get:
      summary: Download Security Technology config file
      tags:
      - Security technologies
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - type: network
                technology:
                  vendor: Suricata
                  product: Suricata
                  tech_type: IDS
                  version: 3.1.3
                  logo: suricata_logo_2.png
      operationId: getSecurityTechnologiesDownloadConfig
      x-operation-id-source: derived
components:
  schemas:
    config_submit:
      type: object
      properties:
        config:
          type: string
          description: 'JSON-encoded string containing the security technology config

            '
