info:
  title: Mandiant MSI API
  version: 4.14.7.0
  description: 'Operations tagged MSI across 2 of this provider''s published API definitions: mandiant-msv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: MSI
paths:
  /msi_integrations:
    get:
      summary: List Active MSI integrations.
      tags:
      - MSI
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - organization_id: 1
                id: 1
                paused: false
                disabled: false
                type: elasticsearch
                brand_name: Elasticsearch
                msi_version: v1
                config:
                  meta_config: {}
                  conn_config: {}
                  runtime_config:
                    queries: []
                    alert_query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"@timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                    field_map:
                      __default__:
                        uid: []
                        start_time: []
                        description: []
                        src_ip: []
                        src_port: []
                        dest_ip: []
                        dest_port: []
                        url: []
                        email_sender: []
                        email_recipient: []
                        email_subject: []
                        host: []
                        computer: []
                        user: []
                        sid: []
                    alert_field_map:
                      uid: []
                      description: []
                      start_time: []
                      host: []
                      base_event_uids: []
                    max_pages: 100
                    page_size: 500
                  queries_with_labels:
                  - name: IP Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: Hostname Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%HOSTNAMES%) OR destination.ip:(%HOSTNAMES%) OR\\nhost.hostname:(%HOSTNAMES%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: DNS Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"domain:(%DOMAINS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: Email Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(sender:(%SENDERS%) OR recipient:(%RECIPIENTS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                int_app_owned: null
                msi_uuid: null
                host: host.com
                correlation_query_enabled: false
                last_query_results_at: null
                remote: false
                node_id: null
                updated_at: '2025-05-14T20:08:32.068Z'
                time_adjustment: 0
                name: elasticsearch
                discovery_enabled: true
                query_min_back: 15
                delay_time: 0
                correlation_query: ''
                query_frequency: 30
                correlation_query_frequency: 60
                created_at: '2025-05-14T20:08:32.068Z'
                last_query: null
                save_suspect_events: false
                query_results_limit: 10000
                correlation_query_min_back: 60
      operationId: getMsiIntegrations
      x-operation-id-source: derived
    post:
      summary: Creates a new MSI Integration
      description: The spec endpoint can be used as reference for the Integration configuration schema
      tags:
      - MSI
      parameters:
      - name: type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/msi_type'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/msi_integration'
            example:
              integration:
                organization_id: 1
                id: 1
                paused: false
                disabled: false
                brand_name: Palo Alto Networks Next-Gen Firewall
                msi_version: v1
                config:
                  meta_config: {}
                  conn_config:
                    protocol: https
                    port: 443
                    appliance_type: Panorama Console
                    verify_ssl: false
                    timeout: 30
                    host: 10.10.0.3
                    username: admin
                  runtime_config:
                    appliance_timezone: UTC
                    log_types:
                    - traffic
                    - threat
                    queries:
                    - (%IPS%) and (time_generated geq '%START_TIME%') and (time_generated leq '%END_TIME%')
                    page_size: 1000
                    query_max_pages: 10
                    field_map:
                      src_ip:
                      - src
                      src_port:
                      - sport
                      dest_ip:
                      - dst
                      dest_port:
                      - dport
                      start_time:
                      - __default__
                      uid:
                      - __default__
                      sid: []
                      url: []
                      email_sender: []
                      email_recipient: []
                      email_subject: []
                      description:
                      - __default__
                      host:
                      - __default__
                      computer:
                      - __default__
                      user: []
                      filehashes: []
                host: 10.10.0.3
                correlation_query_enabled: false
                last_query_results_at: '2025-04-24T16:06:04.318Z'
                node_id: null
                updated_at: '2025-04-24T16:06:04.340Z'
                time_adjustment: 0
                name: panoramaa
                discovery_enabled: true
                query_min_back: 15
                delay_time: 0
                correlation_query: ''
                query_frequency: 30
                correlation_query_frequency: 60
                created_at: '2025-04-17T18:07:12.016Z'
                last_query: (%IPS%) and (time_generated geq '%START_TIME%') and (time_generated leq '%END_TIME%')
                save_suspect_events: false
                query_results_limit: 10000
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
      operationId: postMsiIntegrations
      x-operation-id-source: derived
  /msi_integrations/{id}:
    get:
      summary: Get an individual MSI Integration
      tags:
      - MSI
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
      operationId: getMsiIntegrationsById
      x-operation-id-source: derived
    put:
      summary: Update an existing MSI integration
      tags:
      - MSI
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/msi_integration'
            example:
              organization_id: 1
              id: 1
              paused: false
              disabled: false
              type: elasticsearch
              brand_name: Elasticsearch
              msi_version: v1
              config:
                meta_config: {}
                conn_config:
                  protocol: https
                  port: 9200
                  verify_ssl: false
                  timeout: 30
                  username: username
                  host: host.com
                runtime_config:
                  queries:
                  - "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%HOSTNAMES%) OR destination.ip:(%HOSTNAMES%) OR\\nhost.hostname:(%HOSTNAMES%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"domain:(%DOMAINS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(sender:(%SENDERS%) OR recipient:(%RECIPIENTS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  alert_query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"@timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  field_map:
                    __default__:
                      uid:
                      - _id
                      start_time:
                      - _source.timestamp
                      - _source.@timestamp
                      description:
                      - _source.kibana.alert.rule.name
                      - _source.description
                      - _source.message
                      - _source.event.action
                      - _source.alert.signature
                      - _source.event.type
                      - _source.rule.name
                      src_ip:
                      - _source.source.ip
                      - _source.host.ip
                      src_port:
                      - _source.source.port
                      dest_ip:
                      - _source.destination.ip
                      dest_port:
                      - _source.destination.port
                      url:
                      - _source.domain
                      email_sender:
                      - _source.sender
                      email_recipient:
                      - _source.recipient
                      email_subject:
                      - _source.subject
                      host:
                      - _source.host.hostname
                      - _source.host.name
                      - _source.agent.name
                      - __default__
                      computer:
                      - _source.computer
                      - _source.agent.name
                      - _source.host.hostname
                      user:
                      - _source.user
                      sid:
                      - _source.alert.signature_id
                  alert_field_map:
                    uid:
                    - _id
                    description:
                    - _source.kibana.alert.rule.name
                    - _source.description
                    - _source.message
                    - _source.event.action
                    - _source.alert.signature
                    - _source.event.type
                    - _source.rule.name
                    start_time:
                    - _source.timestamp
                    - _source.@timestamp
                    - _source.hits.hits.0._source.timestamp
                    - _source.hits.hits.0._source.@timestamp
                    host:
                    - _source.host.hostname
                    - _source.host.name
                    - _source.agent.name
                    - __default__
                    base_event_uids:
                    - _source.base_event_uids
                    - __default__
                  max_pages: 100
                  page_size: 500
                queries_with_labels:
                - name: IP Query
                  query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                - name: Hostname Query
                  query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%HOSTNAMES%) OR destination.ip:(%HOSTNAMES%) OR\\nhost.hostname:(%HOSTNAMES%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                - name: DNS Query
                  query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"domain:(%DOMAINS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                - name: Email Query
                  query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(sender:(%SENDERS%) OR recipient:(%RECIPIENTS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
              int_app_owned: null
              msi_uuid: null
              host: host.com
              correlation_query_enabled: false
              last_query_results_at: null
              remote: false
              node_id: null
              updated_at: '2025-05-14T20:08:32.068Z'
              time_adjustment: 0
              name: elasticsearch updated
              discovery_enabled: true
              query_min_back: 15
              delay_time: 0
              correlation_query: ''
              query_frequency: 30
              correlation_query_frequency: 60
              created_at: '2025-05-14T20:08:32.068Z'
              last_query: null
              save_suspect_events: false
              query_results_limit: 10000
              correlation_query_min_back: 60
      responses:
        '200':
          description: Success
      operationId: putMsiIntegrationsById
      x-operation-id-source: derived
    delete:
      summary: Remove an existing MSI integration
      tags:
      - MSI
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
      operationId: deleteMsiIntegrationsById
      x-operation-id-source: derived
  /msi_integrations/{id}/run_test_query:
    post:
      summary: Run a Test Query for an MSI Integration
      description: The values for the var_config can be blank. Depending on the test query, filters can be hardcoded. If using a query with %VARIABLES%, var_config values should be supplied in order to substitute the %VARIABLES%
      tags:
      - MSI
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 'Required for integration types that use a query

                '
              required:
              - query
              - var_config
              properties:
                query:
                  type: string
                var_config:
                  type: object
                  properties:
                    ips:
                      type: array
                      items:
                        type: string
                    hostnames:
                      type: array
                      items:
                        type: string
                    domains:
                      type: array
                      items:
                        type: string
                    email_senders:
                      type: array
                      items:
                        type: string
                    email_recipients:
                      type: array
                      items:
                        type: string
                    user_accounts:
                      type: array
                      items:
                        type: string
                    start_time:
                      type: string
                    end_time:
                      type: string
            example:
              query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
              var_config:
                hostnames:
                - actor
                start_time: '2025-05-14T20:23:04.668Z'
                end_time: '2025-05-14T20:38:04.668Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: []
      operationId: postMsiIntegrationsByIdRunTestQuery
      x-operation-id-source: derived
  /msi_integrations/{id}/config_health:
    get:
      summary: Checks the MSI Integration configuration
      description: Validates the configuration against the technology
      tags:
      - MSI
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success - configuration is valid
        '404':
          description: Not Found using the id params
        '500':
          description: Error - configuration is invalid. Displays the error encountered
      operationId: getMsiIntegrationsByIdConfigHealth
      x-operation-id-source: derived
  /msi_integrations/{type}/readme:
    get:
      summary: Returns the readme for the MSI Integration
      tags:
