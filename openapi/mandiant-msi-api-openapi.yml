      x-operation-id-source: derived
  /msi_integrations/spec/{type}:
    get:
      summary: Returns the JSON schema for the MSI Integration
      tags:
      - MSI
      parameters:
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/msi_type'
      responses:
        '200':
          description: Success
      operationId: getMsiIntegrationsSpecByType
      x-operation-id-source: derived
