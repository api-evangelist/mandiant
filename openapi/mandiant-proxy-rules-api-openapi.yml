components:
  schemas:
    proxy_comm:
      type: object
      required:
      - name
      - proxy_ip
      - proxy_port
      - proxy_type
      properties:
        name:
          type: string
        proxy_ip:
          type: string
          description: Proxy IP address, must be a valid IP address or domain name
        proxy_port:
          type: integer
          minimum: 1
          maximum: 65535
        proxy_type:
          type: string
          enum:
          - http
          - http_auth
          - http_https_auto
          - http_https_auto_auth
          - http_kerberos
          - http_ntlm
          - https
          - https_auth
          - ssl_mitm
          - socks
          - socks_auth
        auth_username:
          type: string
          description: 'Proxy username, only required if proxy uses authentication

            '
        auth_password:
          type: string
          description: 'Proxy password, only required if proxy uses authentication

            '
        kerberos_domain_controller:
          type: string
          description: 'Kerberos domain controller. Only required if proxy_type is `http_kerberos`. Must be a valid IP address.

            '
        kerberos_realm:
          type: string
          description: 'Kerberos realm.  Only required if proxy_type is `http_kerberos`.

            '
        proxy_fqdn:
          type: string
          description: 'Fully qualified domain name for proxy.  Only required if proxy_type is `http_kerberos`.

            '
    proxy_comm_wrapped:
      type: object
      properties:
        proxy_comm:
          $ref: '#/components/schemas/proxy_comm'
