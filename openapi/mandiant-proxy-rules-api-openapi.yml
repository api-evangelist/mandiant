info:
  title: Mandiant Proxy Rules API
  version: '1.0'
  description: 'Operations tagged Proxy Rules across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Proxy Rules
  description: Proxy Rules specify proxies to use for MSV traffic.
