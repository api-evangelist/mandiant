    patch:
      description: Updates the specified fields for an existing alert. Note that not all fields of an alert are writable.
      operationId: patch-alerts-id
      parameters:
      - description: The accept type for the response body.
        in: header
        name: Accept
        required: true
        schema:
          type: string
      - description: The content type of the request body.
        in: header
        name: Content-Type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              add-tags:
                value:
                  tags:
                  - tag1
                  - tag2
              patch-status-read:
                value:
                  status: read
            schema:
              properties:
                status:
                  enum:
                  - new
                  - read
                  - closed
                  - escalated
                  - in_progress
                  - no_action_required
                  - duplicate
                  - not_relevant
                  - tracked_external
                  type: string
                tags:
                  items:
                    type: string
                  type: array
              type: object
        description: Update one or more writable fields of an alert.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: OK
          headers:
            Content-Type:
              description: The content type of the response body.
              schema:
                type: string
