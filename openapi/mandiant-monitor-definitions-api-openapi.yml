components:
  schemas:
    monitor:
      type: object
      properties:
        monitor_def:
          $ref: '#/components/schemas/monitor_def'
        action_id:
          type: integer
          description: 'Required if monitor is for an Action, indicates which Action the Monitor runs

            '
        simulation_id:
          type: integer
          description: 'Required if monitor is for a Sequence or Evaluation, indicates what the Monitor runs

            '
        monitor_type_step_<num>:
          type: string
          enum:
          - node
          - zone
          description: 'Each step of the monitor must specify whether it''s to be run between actors (nodes) or zones

            '
        attack_node_id_step_<num>:
          type: integer
          description: 'ID of attacker Actor if step is run between actors.  Replace <num> with the order of the step, starting at 1.

            '
        target_node_id_step_<num>:
          type: integer
          description: 'ID of target Actor if step is run between actors. Replace <num> with the order of the step, starting at 1.

            '
        attack_zone_id_step_<num>:
          type: integer
          description: 'ID of attacker Security Zone if step is run between zones

            '
        target_zone_id_step_<num>:
          type: integer
          description: 'ID of target Security Zone if step is run between zones

            '
        monitor_def_datetime:
          type: string
          description: 'Date and time of first run of the monitor.  Must be a string in a format like: `2016/09/01 17:14 UTC`

            '
        repeat_job_period_number:
          type: integer
          minimum: 1
          description: 'Number indicating how often to repeat monitor

            '
        repeat_job_period_type:
          type: string
          enum:
          - seconds
          - minutes
          - hours
          - days
          description: 'String indicating how repeat_job_period_number parameter is interpreted

            '
    monitor_def:
      type: object
      properties:
        name:
          type: string
          description: Name of monitor
        desc:
          type: string
          description: Description of monitor
        monitor_group_id:
          type: integer
          description: ID of monitor group this monitor belongs to
