openapi: 3.2.0
info:
  title: Mandiant Integration API Tokens API
  version: '1.0'
  description: 'Operations tagged Integration API Tokens across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Integration API Tokens
  description: 'Tokens to use when authenticating with the Integrations API. When being used, the token must be in the Authorization header as a bearer token like "Authorization: Bearer abc123"'
paths:
  /api_users:
    get:
      summary: List all existing Integration API Tokens
      tags:
      - Integration API Tokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 1
                organization_id: 1
                authentication_token: abc123
                name: Integration SDK User
                disabled: false
                created_at: '2020-01-06T19:18:15.341Z'
                updated_at: '2020-01-18T18:04:38.083Z'
      operationId: getApiUsers
      x-operation-id-source: derived
    post:
      summary: Create a new Integration API Token
      tags:
      - Integration API Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api_user_wrapped'
            example:
              api_user:
                name: New Integration API Token
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 2
                organization_id: 1
                authentication_token: xyz789
                name: New Integration API Token
                disabled: false
                created_at: '2020-02-06T19:10:10.341Z'
                updated_at: '2020-02-06T19:10:10.341Z'
      operationId: postApiUsers
      x-operation-id-source: derived
  /api_users/{id}:
    get:
      summary: List a single Integration API Token by ID
      tags:
      - Integration API Tokens
      parameters:
      - name: id
        in: path
        description: The unique ID.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 1
                organization_id: 1
                authentication_token: abc123
                name: Integration SDK User
                disabled: false
                created_at: '2020-01-06T19:18:15.341Z'
                updated_at: '2020-01-18T18:04:38.083Z'
      operationId: getApiUsersById
      x-operation-id-source: derived
    put:
      summary: Update an existing Integration API Token
      tags:
      - Integration API Tokens
      parameters:
      - name: id
        in: path
        description: The unique ID of the API token.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api_user_wrapped'
            example:
              api_user:
                name: Renamed Integration API Token
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 2
                organization_id: 1
                authentication_token: xyz789
                name: Renamed Integration API Token
                disabled: false
                created_at: '2020-02-06T19:10:10.341Z'
                updated_at: '2020-02-08T12:13:58.072Z'
      operationId: putApiUsersById
      x-operation-id-source: derived
    delete:
      summary: Delete an existing Integration API Token
      tags:
      - Integration API Tokens
      parameters:
      - name: id
        in: path
        description: The unique ID of the API token.
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
      operationId: deleteApiUsersById
      x-operation-id-source: derived
  /api_users/{id}/regenerate_token:
    put:
      summary: Regenerate token
      description: Regenerate this existing Integration API Token and revoke the existing token
      tags:
      - Integration API Tokens
      parameters:
      - name: id
        in: path
        description: The unique ID of the API token.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 2
                organization_id: 1
                authentication_token: newtoken
                name: New Integration API Token
                disabled: false
                created_at: '2020-02-06T19:10:10.341Z'
                updated_at: '2020-02-08T23:12:08.912Z'
      operationId: putApiUsersByIdRegenerateToken
      x-operation-id-source: derived
components:
  schemas:
    api_user_wrapped:
      type: object
      properties:
        api_user:
          $ref: '#/components/schemas/api_user'
    api_user:
      type: object
      required:
      - name
      properties:
        name:
          type: string
x-refined-from:
- mandiant-ma-sv-openapi.yml
- mandiant-msv-openapi.yml
- mandiant-ma-sv-openapi.yml
- mandiant-msv-openapi.yml
