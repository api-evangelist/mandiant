  title: Mandiant Job Actions API
  version: 4.14.7.0
  description: 'Operations tagged Job Actions across 2 of this provider''s published API definitions: mandiant-msv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Job Actions
  description: The result of running an action as part of a simulation. Belongs to a Job
paths:
  /job_actions/{id}:
    put:
      summary: Update an existing Job Action
      description: Job Actions are mostly immutable objects. The include_in_reports parameter can be updated. When include_in_reports is set to false the job action will not be included in reports
      tags:
      - Job Actions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The ID of the job action to update.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_action:
                  type: object
                  properties:
                    include_in_reports:
                      type: boolean
            example:
              job_action:
                include_in_reports: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 1
                job_step_id: 1
                sim_action_id: 651
                status: not run
