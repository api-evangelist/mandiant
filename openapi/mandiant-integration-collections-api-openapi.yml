      tags:
      - Integration Collections
      summary: Destroy
      description: 'Removes integration from a Collection. Integration will not be deleted from the platform.


        UUID is of the integration_collection. found in {{base_url}}/api/v1/integration_collections. This value is also displayed in the post Create {{base_url}}/api/v1/user_collections/:collection_uuid/integration_collections'
      parameters:
      - name: INTRIGUE_ACCESS_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: uuid
        in: path
