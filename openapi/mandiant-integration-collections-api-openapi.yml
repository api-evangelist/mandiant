        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: PROJECT_ID
        in: header
        schema:
          type: string
        description: 'Required: id from {{base_url}}/api/v1/projects'
        example: '{{project_id}}'
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Fri, 09 Sep 2022 16:54:43 GMT
            Content-Type:
              schema:
                type: string
                example: application/json
