openapi: 3.2.0
info:
  title: Mandiant Sequences and Evaluations API
  version: '1.0'
  description: 'Operations tagged Sequences and Evaluations across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Sequences and Evaluations
  description: Sequences and evaluations can have one or more steps, each containing one or more actions. Each step of a sequence or evaluation can be run between different actors, but all the actions within a single step must run between the same actors. Sequences typically represent a complete network attack and Evaluations are often groups of similar actions.
paths:
  /jobs/run_now:
    post:
      summary: Run a job from a sequence or evaluation
      description: The ID of the sequence or evaluation should be passed as the sim_id parameter; to get a list of available IDs, use the GET /simulations API endpoint. To run a single action instead of a sequence or evaluation, use the POST /manage_sims/actions/{id}/run API endpoint.
      tags:
      - Sequences and Evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/run_job'
            example:
              sim_id: 29
              schedule_run_now_selector: run_now
              attack_node_id_1: '2'
              target_node_id_1: '3'
              attack_node_id_2: '2'
              target_node_id_2: '3'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 8
                plan_id: 8
                status: waiting
                progress: Preparing Job
                created_at: '2020-02-10T15:15:36.839Z'
                updated_at: '2020-02-10T15:15:36.839Z'
                organization_id: 55
                status_desc: null
                user_id: 27
                simulation_id: 29
                node_action_queue_id: null
                monitor: null
                scheduled_action_id: null
                planner_controlled: null
                desc: null
                name: null
                parent_job_id: null
                job_actions: []
      operationId: postJobsRunNow
      x-operation-id-source: derived
  /simulations:
    get:
      summary: List sequences or evaluations
      description: This endpoint can also return a CSV export of the Sequences/Evaluations by adding `.csv` to the end of the route rather than `.json`
      tags:
      - Sequences and Evaluations
      parameters:
      - name: sim_type
        in: query
        required: true
        description: 'Indicate whether you want to list sequences or evaluations

          '
        schema:
          type: string
          enum:
          - sequence
          - eval
      - name: name_filter
        in: query
        description: Filter simulation by name
        schema:
          type: string
      - name: vid_filter
        in: query
        description: Filter simulations by VID
        schema:
          type: string
      - name: tag_filter
        in: query
        description: Filter simulation by a single tag
        schema:
          type: string
      - name: fields
        in: query
        description: 'Limit returned fields to given elements.  Must be an Array of Strings or comma-separated string indicating multiple fields.  Not available for CSV response.

          '
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 38
                organization_id: 80
                name: Example Sequence 1
                desc: 'example description

                  '
                created_at: '2020-02-10T15:19:33.866Z'
                updated_at: '2020-02-10T15:19:33.866Z'
                stop_on_error: null
                simulation_type: sequence
                disabled: false
                vid: S282-216
                ver: 1
                uuid: 16e1746b-8675-4ea5-b3af-e386cfc75afd
                metadata_version: null
                protected_endpoint_rollback: 'no'
                sectech_logo_id: null
                run_all_content_marker: null
                verodin_tags: []
                user_tags: []
                tip_aliases: []
                user_tip_aliases: []
                sim_actions: ''
                group_names: []
                action_ids: []
                action_vids: []
              - id: 39
                organization_id: 80
                name: Example Sequence 2
                desc: '8 Actions run from queue

                  '
                created_at: '2020-02-10T15:19:33.870Z'
                updated_at: '2020-02-10T15:19:33.870Z'
                stop_on_error: null
                simulation_type: sequence
                disabled: false
                vid: S281-135
                ver: 1
                uuid: 206f989e-3f44-4880-b478-98dbee061de9
                metadata_version: null
                protected_endpoint_rollback: 'no'
                sectech_logo_id: null
                run_all_content_marker: null
                verodin_tags: []
                user_tags: []
                tip_aliases: []
                user_tip_aliases: []
                sim_actions: ''
                group_names: []
                action_ids: []
                action_vids: []
      operationId: getSimulations
      x-operation-id-source: derived
    post:
      summary: Create a sequence or evaluation
      tags:
      - Sequences and Evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_simulation_wrapped'
            examples:
              Evaluation with single group:
                value:
                  simulation:
                    sim_type: eval
                    name: Evaluation with One Group
                    desc: abc
                    steps:
                      '0':
                      - 2
                      - 1
                    step_names:
                    - First group name
              Sequence with multiple groups:
                value:
                  simulation:
                    sim_type: sequence
                    name: Sequence with Multiple Groups
                    desc: abc
                    steps:
                      '0':
                      - 2
                      - 1
                      '1':
                      - 5
                      - 7
                      '2':
                      - 30
                      - 14
                    step_names:
                    - First group name
                    - Second group name
                    - Third group name
      responses:
        '200':
          description: Success
      operationId: postSimulations
      x-operation-id-source: derived
  /v2/simulations/library_simulations_list:
    get:
      summary: List sequences or evaluations
      tags:
      - Sequences and Evaluations
      parameters:
      - name: simulation_type
        in: query
        required: true
        description: 'Indicate whether you want to list sequences or evaluations

          '
        schema:
          type: string
          enum:
          - sequences
          - evaluations
      - name: search
        in: query
        description: 'Searches for given input across multiple fields: name, VID & description


          e.g. `GET /v2/simulations/library_simulations_list?search=owasp`

          '
        schema:
          type: string
      - name: content_tree_ids
        in: query
        description: 'Filter by Content Tree. Use below values to include corresponding data:

          * 1: Sys

          * 2: User

          * 3: Outside

          * 4: Threat Intel

          * 5: Pending

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
      - name: tags
        in: query
        description: 'Filter by tags.


          e.g. `GET /v2/simulations/library_simulations_list?&tags[]=CVE-2018-4878&tag_logic=OR`

          '
        schema:
          type: array
          items:
            type: string
      - name: tag_logic
        in: query
        description: 'logic used when using multiple values in tags query param.


          e.g. `GET /v2/simulations/library_simulations_list?tags[]=foo&tags[]=bar&tag_logic=OR`

          '
        schema:
          type: string
          enum:
          - OR
          - AND
      - name: content_uuids
        in: query
        description: 'Filter by content uuids


          e.g. `GET /v2/simulations/library_simulations_list?content_uuids[]=1352574b-054d-4238-8326-0b73774132bc&content_uuids[]=a5f5a9ba-7de5-4380-ac5c-c219fc00adcf`

          '
        schema:
          type: array
          items:
            type: string
      - name: last_run_status
        in: query
        description: 'Filter by last run status of job action


          e.g. `GET /v2/simulations/library_simulations_list?last_run_status[]=cancelled`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - completed
            - errored
            - cancelled
            - never_ran
      - name: last_run_date
        in: query
        description: 'Filter by last run date of job action. Format: YYYY-mm-dd


          e.g. `GET /v2/simulations/library_simulations_list?last_run_date=2023-12-31`

          '
        schema:
          type: string
      - name: show_full_response
        in: query
        description: 'Get detailed output in response which includes multiple attributes


          e.g. `GET /v2/simulations/library_simulations_list?show_full_response=true`

          '
        schema:
          type: string
          enum:
          - 'true'
      - name: order_by
        in: query
        description: 'Sort result based on an attribute


          e.g. `GET /v2/simulations/library_simulations_list?page_number=1&page_size=2&order_by=id`

          '
        schema:
          type: string
          enum:
          - id
          - name
          - vid
          - updated_at
          - last_added
          - last_run
          - total_runs
      - name: direction
        in: query
        description: 'Sorting direction


          e.g. `GET /v2/simulations/library_simulations_list?page_number=1&page_size=2&order_by=id&direction=desc`

          '
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                simulations:
                - id: 4181577
                  name: Malicious Activity Scenario - Campaign 24-001, Phishing Campaign Distributing ASYNCRAT
                  updated_at: '2024-01-17T19:54:24.930Z'
                  simulation_type: sequence
                  vid: S100-305
                  uuid: f59a2294-23b0-49f3-a365-339119f81e33
                  latest_job: null
                - id: 4181576
                  name: Malicious Activity Scenario - Campaign 23-056, Suspected Russian Espionage Group Conducts Phishing Campaign for Credential Harvesting
                  updated_at: '2024-01-17T19:54:24.746Z'
                  simulation_type: sequence
                  vid: S100-304
                  uuid: d012fb28-0b0e-4ce8-af2e-24a66126b81e
                  latest_job: null
                total_count: 151
                total_pages: 76
                start: 1
      operationId: getV2SimulationsLibrarySimulationsList
      x-operation-id-source: derived
  /simulations/{id}.json:
    delete:
      summary: Disables a Simulation
      description: Security Validation defined Simulations (VIDs that start with 'S1') cannot be disabled and will respond with HTTP status code 422. If the Simulation is successfully disabled, a response with HTTP status code 204 is returned.
      tags:
      - Sequences and Evaluations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No content
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                base:
                - Verodin System Content cannot be deleted
      operationId: deleteSimulations{id}Json
      x-operation-id-source: derived
