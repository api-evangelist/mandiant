  /reports/dimension_children:
    get:
      summary: List child behaviors
      description: List of child behaviors for a given Behavior, to an arbitrary depth
      parameters:
      - $ref: '#/components/parameters/type_filter'
      - name: depth
        in: query
        schema:
          type: integer
          minimum: 0
          default: 1
      tags:
      - Reports
      responses:
        '200':
          description: Success
      operationId: getReportsDimensionChildren
      x-operation-id-source: derived
  /reports/summary_chart_data:
    get:
      summary: Summary report data
      description: Data underlying the MSV Summary Page. Overview of Security Technologies, Zones, Integrations, and statistics related to a given Behavior.
      tags:
      - Reports
      parameters:
      - name: types
        in: query
        description: 'Array of Strings indicating names of Dimensions to return in report.  Options for the Dimension names can be obtained from a request to `GET /reports/filter_data.json`.

          '
        schema:
          type: array
          default:
          - Attack Vector
          - Stage of Attack
          - Behavior Type
          items:
            type: string
      - name: job_ids
        in: query
        description: 'List of job IDs to include in the results.

          '
        schema:
