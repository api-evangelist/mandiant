openapi: 3.2.0
info:
  title: Mandiant Reports API
  version: '1.0'
  description: 'Operations tagged Reports across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Reports
  description: 'Reports are the finished product of system interactions.

    Behaviors are the possibly-nested umbrella for job actions.

    Zones are the pseudological encapsulation of areas of influence in the system.

    SecTech are the types of security technologies implemented by the system.'
paths:
  /reports/zone_chart_data:
    get:
      summary: List of Zones related to a given Behavior
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/type_filter'
      - $ref: '#/components/parameters/time_range'
      - $ref: '#/components/parameters/zones_filter'
      responses:
        '200':
          description: Success
      operationId: getReportsZoneChartData
      x-operation-id-source: derived
  /reports/integration_chart_data:
    get:
      summary: Integrations related to a Behavior
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/type_filter'
      - $ref: '#/components/parameters/time_range'
      - $ref: '#/components/parameters/zones_filter'
      responses:
        '200':
          description: Success
      operationId: getReportsIntegrationChartData
      x-operation-id-source: derived
  /reports/behavior_chart_data:
    get:
      summary: Results for a Behavior
      description: List of Security Technologies, Zones, Integrations, and statistics related to a given Behavior
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/type_filter'
      - $ref: '#/components/parameters/time_range'
      - $ref: '#/components/parameters/zones_filter'
      responses:
        '200':
          description: Success
      operationId: getReportsBehaviorChartData
      x-operation-id-source: derived
  /reports/gauge_data:
    get:
      summary: Gauges data
      description: Data underlying the MSV Gauges Page. List of Security Technologies, Integrations, and statistics related to a set of given Behaviors
      tags:
      - Reports
      parameters:
      - name: types
        in: query
        required: true
        description: 'Array of Strings indicating names of Dimensions to return in report.  Options for the Dimension names can be obtained from a request to `GET /reports/filter_data.json`.

          '
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/date_range'
      - $ref: '#/components/parameters/zones_filter'
      - $ref: '#/components/parameters/sectech_filter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - SecTech:
                  missed:
                  - logo_path: /images/logos/1/suricata_logo.png
                    percentage: 60
                    count: 3
                    label: Suricata - Suricata(IDS)
