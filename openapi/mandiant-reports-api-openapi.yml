  /reports/data_exfil.json:
    get:
      summary: Data Exfil report
      description: This endpoint is deprecated and will be removed in a future release.
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/old_time'
      - $ref: '#/components/parameters/old_relationship'
      - $ref: '#/components/parameters/old_show'
      - $ref: '#/components/parameters/old_group'
      - name: divisions
        in: query
        description: 'Determines how many divisions there are for the given time range.

          '
        schema:
          type: integer
          minimum: 1
      - name: nodes
        in: query
        description: 'List of job action attack node IDs to include in the results.

          '
        schema:
          type: array
          items:
            type: integer
      - name: zones
        in: query
        description: 'List of job action attack node security zone IDs to include in the results.

          '
        schema:
          type: array
          items:
            type: integer
      - name: tags
        in: query
        description: 'List of tag IDs to include in the results.

          '
        schema:
          type: array
          items:
            type: integer
      - name: dimensions
        in: query
        description: 'List of dimension IDs to include in the results.

          '
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
      operationId: getReportsDataExfilJson
      x-operation-id-source: derived
  /reports/malicious_transfer.json:
