          content:
            application/json:
              example: (Same structure as Data Exfil report)
      operationId: getReportsMaliciousTransferJson
      x-operation-id-source: derived
components:
  parameters:
    zones_filter:
      name: zones
      in: query
      description: 'List of Security Zones to include in the results.  Must be Array of Strings indicating Security Zone names.

        '
      schema:
        type: array
        items:
          type: string
    old_group:
      name: group
      in: query
      description: 'Whether to group blocked actions or separate payload/connection blocked actions

        '
      schema:
        type: string
        enum:
        - grouped
        - separate
        default: separate
    old_show:
      name: show
      in: query
      description: 'Which blocked actions to show, whether payload-blocked, connection-blocked, or all

        '
      schema:
        type: string
        enum:
        - all
        - payload
        - connection
        default: all
    time_range:
      name: time_range
      in: query
      description: 'Job Action time range for results, of the format `2019-08-27 04:18:42 PM UTC to 2019-09-27 04:18:42 PM UTC`

        '
      schema:
        type: string
    old_time:
      name: time
      in: query
      description: Integer indicating number of days to include in the report
      schema:
        type: integer
        minimum: 1
        default: 30
    date_range:
      name: dateRange
      in: query
      description: 'Job Action time range for results, of the format `2019-08-27 04:18:42 PM UTC to 2019-09-27 04:18:42 PM UTC`

        '
      schema:
        type: string
    sectech_filter:
      name: sectechs
      in: query
      description: 'List of security technology ids to filter results.  No parameter value means show all applicable security technologies.  This list can be obtained from `GET /security_technologies.json`

        '
      schema:
        type: array
        items:
          type: integer
    old_relationship:
      name: relationship
      in: query
      description: Whether to show relationship between blocked and detected
      schema:
        type: string
        enum:
        - 'yes'
        - 'no'
        default: 'no'
    type_filter:
      name: type
      in: query
      required: true
      schema:
        type: string
