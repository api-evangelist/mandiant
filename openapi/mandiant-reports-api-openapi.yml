                    logs:
                      percentage: 0
                      count: 0
                    runs:
                      logo_path: /images/splunk_logo.png
                      percentage: 100
                      count: 5
                    host_name: 192.168.20.20
                behavior_type:
                  results:
                    alerted:
                      percentage: 0
                      count: 0
                      label: Malicious File Transfer
                    logged:
                      percentage: 40
                      count: 2
                      label: Malicious File Transfer
                    missed:
                      percentage: 0
                      count: 0
                      label: Malicious File Transfer
                    detected:
                      percentage: 40
                      count: 2
                      label: Malicious File Transfer
                    prevented:
                      percentage: 100
                      count: 5
                      label: Malicious File Transfer
                    blocked_or_events:
                      percentage: 40
