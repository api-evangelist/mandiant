        schema:
          type: array
          items:
            type: string
      - name: sectechs
        in: query
        description: 'Array of Integers indicating IDs of Security Technologies to return in report.  Options for the Security Technology IDs can be obtained from a request to `GET /reports/filter_data.json`.

