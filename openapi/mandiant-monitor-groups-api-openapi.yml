openapi: 3.2.0
info:
  title: Mandiant Monitor groups API
  version: '1.0'
  description: 'Operations tagged Monitor groups across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Monitor groups
  description: Groups to contain multiple Monitor Definitions
paths:
  /monitor_groups:
    get:
      summary: List monitor groups
      tags:
      - Monitor groups
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 36
                name: Unassigned
                organization_id: 69
                created_at: '2020-02-10T15:17:06.882Z'
                updated_at: '2020-02-10T15:17:06.882Z'
              - id: 37
                name: MyString
                organization_id: 69
                created_at: '2020-02-10T15:17:10.652Z'
                updated_at: '2020-02-10T15:17:10.652Z'
              - id: 38
                name: Additional Example
                organization_id: 69
                created_at: '2020-02-10T15:17:10.655Z'
                updated_at: '2020-02-10T15:17:10.655Z'
      operationId: getMonitorGroups
      x-operation-id-source: derived
    post:
      summary: Create a monitor group
      tags:
      - Monitor groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/monitor_group_wrapped'
            example:
              monitor_group:
                name: Example Monitor Group
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 33
                name: Example Monitor Group
                organization_id: 67
                created_at: '2020-02-10T15:16:43.343Z'
                updated_at: '2020-02-10T15:16:43.343Z'
      operationId: postMonitorGroups
      x-operation-id-source: derived
  /monitor_groups/{id}:
    get:
      summary: Show a monitor group
      tags:
      - Monitor groups
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 40
                name: MyString
                organization_id: 70
                created_at: '2020-02-10T15:17:23.571Z'
                updated_at: '2020-02-10T15:17:23.571Z'
      operationId: getMonitorGroupsById
      x-operation-id-source: derived
    delete:
      summary: Destroy a monitor group
      tags:
      - Monitor groups
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                result: success
      operationId: deleteMonitorGroupsById
      x-operation-id-source: derived
components:
  schemas:
    monitor_group_wrapped:
      type: object
      properties:
        monitor_group:
          $ref: '#/components/schemas/monitor_group'
    monitor_group:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of monitor group.  Must be unique.
