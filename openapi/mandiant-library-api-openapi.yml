openapi: 3.2.0
info:
  title: Mandiant Library API
  version: 1.0.6
  description: 'Operations tagged Library across 2 of this provider''s published API definitions: mandiant-asm-openapi.yml, mandiant-asm-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://{{base_url}}
tags:
- name: Library
paths:
  /api/library/entities:
    get:
      tags:
      - Library
      summary: Entities List
      description: Returns types of entities.
      security:
      - noauthAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryEntities
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/entities/stats:
    get:
      tags:
      - Library
      summary: Entities Stats
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryEntitiesStats
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/issues:
    get:
      tags:
      - Library
      summary: Issues List
      description: View list of all issue types. Change Page value to display next 100 issues.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryIssues
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/issues/{issue_name}:
    get:
      tags:
      - Library
      summary: Issues List - Specific Isssue
      description: Send a specific entity type, and get the definition
      parameters:
      - name: issue_name
        in: path
        schema:
          type: string
        required: true
        example: missing_dmarc_policy
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Wed, 10 Mar 2021 16:37:45 GMT
            Content-Type:
              schema:
                type: string
                example: application/json
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            Set-Cookie:
              schema:
                type: string
                example: rack.session=BAh7B0kiD3Nlc3Npb25faWQGOgZFVG86HVJhY2s6OlNlc3Npb246OlNlc3Npb25JZAY6D0BwdWJsaWNfaWRJIkUxZDEwOWVjZjNhZjg2ZjQyZjVhMWU5NDIzNjQ2ODVhYjc5NWMwZTZlMTgyYjE0NzgyNjVmMTYzMDEyZGRkZTg2BjsARkkiFXBvc3Rfc2lnbmluX3BhdGgGOwBGIgwvc2lnbmlu--599b4fb47fdf41d17c27205eed3f5a751e993ea4; path=/; expires=Fri, 09 Apr 2021 16:37:45 GMT; HttpOnly
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Vary:
              schema:
                type: string
                example: Origin
            Via:
              schema:
                type: string
                example: 1.1 vegur
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            cf-request-id:
              schema:
                type: string
                example: 08be99725300000f3e05850000000001
            Expect-CT:
              schema:
                type: string
                example: max-age=604800, report-uri="https://report-uri.cloudflare.com/cdn-cgi/beacon/expect-ct"
            Report-To:
              schema:
                type: string
                example: '{"max_age":604800,"group":"cf-nel","endpoints":[{"url":"https:\/\/a.nel.cloudflare.com\/report?s=VakeRmXj8nJPabhkHVXvRNJO0Z7fVKooBSDnFkUxS1Y0BKovdBNZCtfx5IJD3LENGk2rkZwYAFYU5CDfE%2BcAvuTkLQd8dotV28ZCMWyXX1Y%3D"}]}'
            NEL:
              schema:
                type: string
                example: '{"max_age":604800,"report_to":"cf-nel"}'
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 62ddf8308b2b0f3e-DFW
            Content-Encoding:
              schema:
                type: string
                example: br
          content:
            application/json:
              schema:
                type: object
              example:
                success: true
                message: success
                result:
                  added: '2020-01-01'
                  name: missing_dmarc_policy
                  pretty_name: Missing DMARC Policy
                  category: misconfiguration
                  source: DNS
                  severity: 4
                  status: confirmed
                  description: DMARC is a policy (configured in a DNS record) that explains the email authentication practices for a given domain. When configured, it helps prevent spam and other abuses. In practice, it simply provides a receiving mail server (upon receipt of a new email) with enough information to  determine the validity of a sender. All domains configured to send email should implement DMARC, as it is one of the most important steps that can be taken to improve email deliverability.
                  references:
                  - type: description
                    uri: https://www.sparkpost.com/resources/email-explained/dmarc-explained/
                  - type: description
                    uri: https://www.sonicwall.com/support/knowledge-base/what-is-a-dmarc-record-and-how-do-i-create-it-on-dns-server/170504796167071/
      operationId: getApiLibraryIssuesByIssueName
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/issues/stats:
    get:
      tags:
      - Library
      summary: Issues Stats
      description: 'Statistics about the issues, Total count, Count by category:'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryIssuesStats
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/tasks:
    get:
      tags:
      - Library
      summary: Tasks List
      description: View all tasks. Change Page value to display next 100
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        example: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryTasks
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/tasks/stats:
    get:
      tags:
      - Library
      summary: Tasks Stats
      description: 'Returns a list of current task type count, and count by Author:'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryTasksStats
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/fingerprints:
    get:
      tags:
      - Library
      summary: Fingerprints List
      description: Returns Technology fingerprints from Library.
      parameters:
      - name: sort
        in: query
        schema:
          type: string
        description: name, product, vendory, version
        example: name
      - name: search
        in: query
        schema:
          type: string
        description: searches vendor and product fields
        example: '"apache http server"'
      - name: page
        in: query
        schema:
          type: integer
        example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryFingerprints
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/fingerprints/stats:
    get:
      tags:
      - Library
      summary: Fingerprint Stats
      description: Statistics about the Fingerprint (ident) capabilities
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryFingerprintsStats
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/issues/export/csv:
    get:
      tags:
      - Library
      summary: Issues List - Export as CSV
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryIssuesExportCsv
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/tasks/export/csv:
    get:
      tags:
      - Library
      summary: Tasks List - Export as CSV
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryTasksExportCsv
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/library/catalog/stats:
    get:
      tags:
      - Library
      summary: Catalog Stats
      description: Statistics about the Catalog
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiLibraryCatalogStats
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
x-refined-from:
- mandiant-asm-openapi.yml
- mandiant-asm-openapi.yml
