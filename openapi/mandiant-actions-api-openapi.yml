  /manage_sims/actions/{id}/run:
    post:
      summary: Run an action
      description: Execute the Action specified by id in the URL and return the resulting job. See the GET /jobs/{id} documentation for descriptions of the response values. To get the ID for the Action you want to run, use the GET /manage_sims/actions API call which returns a list of all Actions on Director. Must end with either ".json" or ".xml".
      tags:
      - Actions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The action ID to lookup.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/run_action-action'
            examples:
              action:
                summary: Generic action
                value:
                  attack_node_id_1: '5'
                  target_node_id_1: '6'
              host_cli_with_user_profile:
                summary: Host CLI with User Profile
                value:
                  attack_node_id_1: '13'
                  'action_user_profile_id:':
                    '1': 12
              cloud_action:
                summary: Cloud action
                value:
                  attack_node_id_1: 3
                  cloud_profile_ids:
                  - - - 1
                      - null
                  run_time_params:
                    '1':
                      '1980':
                        input_values:
                          list_times: 5
                          test_input: not default
              port_scan_action:
