  /manage_sims/actions/filtered_actions:
    get:
      summary: Returns a hash of sim_actions filtered by user provided tags
      tags:
      - Actions
      parameters:
      - in: query
        name: techniques
        schema:
          type: string
        required: false
        description: techniques to filter by, single or comma separated array T1001 or T1001,T1002,T1003
      - in: query
        name: malware_families
        schema:
          type: string
        required: false
        description: malware families to filter by, single or comma separated array PINGCASTLE or PINGCASTLE,SALTLICK
      - in: query
        name: actor
        schema:
          type: string
        required: false
        description: actors to filter by, single or comma separated array APT17 or APT17,APT2,APT3
      - in: query
        name: cve
        schema:
          type: string
        required: false
        description: cve's to filter by, single or comma separated array CVE-2002-1123, or CVE-2010,CVE-2013-1347
      - in: query
        name: exact
        schema:
          type: string
        required: false
        description: use AND logic when determining matches, by default this is false and uses OR logic
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                count: 4
                actions:
                - name: Command and Control - BEDEP Trojan, C2 Communications with DGA Domains
                  id: A100-861
                  description: "This Action demonstrates a host infected with BEDEP performing post-infection C2 callbacks. The malware uses the C2 infrastructure to exchange information such as host details and configurations for future click-fraud campaigns. Analysts reviewing this Action should escalate for response actions as this activity indicates an active infection. \n\n"
                - name: Command and Control - NANOCORE RAT, C2 Traffic
                  id: A100-390
                  description: 'This Action demonstrates a host infected with NanoCore RAT communicating with C2 infrastructure. This RAT communicates with C2 infrastructure over TCP port 1012, utilizing a protocol that is not easily decipherable with convention analysis tools. Threat actors such as Gorgon Group have been observed installing the NanonCore RAT while masquerading it as a legitimate tool. More information about these observations can be read about [here]( https://unit42.paloaltonetworks.com/unit42-gorgon-group-slithering-nation-state-cybercrime/).


                    '
                - name: 'Command and Control - AZORULT, C2 Communication, Variant #3'
                  id: A100-716
                  description: This Action demonstrates beaconing to command and control infrastructure from a host infected with the AZORult credential stealer. The beaconing behavior occurs over an HTTP connection. According to FireEye Intelligence, AZORult is a credential stealer that is capable of collecting credentials from several applications, including browsers, cryptocurrency wallets, and Skype. AZORult can send collected information to command and control infrastructure via HTTP and can delete itself from an infected host to cover tracks. The traffic in this Action is from an AZORult variant loaded by TxHollower.
                - name: Command and Control - FORMBOOK, C2 Beacon
                  id: A100-823
                  description: 'This Action demonstrates the FORMBOOK malware beaconing out to  command and control (C2)  infrastructure.


                    FORMBOOK is a data stealer and form grabber that has been advertised in various hacking forums since early 2016.


                    The malware injects itself into various processes and installs function hooks to log keystrokes, steal clipboard contents, and extract data from HTTP sessions. The malware can also execute commands from a C2 server. The commands include instructing the malware to download and execute files, start processes, shutdown and reboot the system, and steal cookies and local passwords.


                    One of the malware''s most interesting features is that it reads Windows’ ntdll.dll module from disk into memory, and calls its exported functions directly, rendering user-mode hooking and API monitoring mechanisms ineffective. The malware author calls this technique "Lagos Island method" (allegedly originating from a userland rootkit with this name). '
        '400':
          description: bad request
          content:
            application/json:
              example:
                status: error
                errors:
                  techniques:
                  - must set one of techniques, malware_families, actor or cve
      operationId: getManageSimsActionsFilteredActions
      x-operation-id-source: derived
  /manage_sims/actions/vid/{vid}.json:
    get:
      summary: Return Action IDs for a given VID
      description: The elements are ordered from enabled to disabled, and sub-ordered by most recently added
      tags:
      - Actions
      parameters:
      - in: path
        name: vid
        required: true
        schema:
          type: string
        description: The VID to lookup.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                ids:
                - '2680'
