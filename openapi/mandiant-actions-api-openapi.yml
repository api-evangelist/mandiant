  /manage_sims/actions/{id}.json:
    get:
      summary: Lookup Action info by ID or VID
      description: 'Get action info by either the Action ID or VID

        * The `lookup_type` can be left off, in which case the path ID will default to the Action ID, such as `/manage_sims/actions/323.json`.

        * If `lookup_type` is provided and set to the Action VID, then the path ID will be expected to be a VID instead, such as `/manage_sims/actions/A104-167.json?lookup_type=vid`.'
      tags:
      - Actions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The action ID to lookup. If `lookup_type` is vid, this should be the vid.
      - in: query
        name: lookup_type
        schema:
          type: string
          enum:
          - id
          - vid
          default: id
        description: Determines how to do the lookup. If nothing is specified, ID is assumed
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                sim_action:
                  id: 647
                  organization_id: 1
                  name: Test Action
                  desc: For API documentation
                  action_type: host_cli
                  timeout_ms: 10000
                  created_at: '2021-08-26T06:15:01.489Z'
                  updated_at: '2021-08-26T06:15:01.521Z'
                  vid: A104-052
                  disabled: false
                  ver: 14
                  uuid: 18e7d573-e0d6-48da-97c4-201ddd48ed8a
                  metadata_version: 31
                  require_endpoint: false
                  approved_version: 14
                  sectech_logo_id: null
                  brt_version: 2.0.31
                  created: '2018-03-28T08:19:56.000Z'
                  required_license: null
                  runtime: null
                  notes: Mandiant Security Validation recommends running this Action on Windows 7, Windows Server 2016 Actors as SYSTEM, Admin users.
                  brt_version_updated_at: null
                  trees: []
                  common_detection_alerts: []
                  host_cli_action:
                    id: 211
                    organization_id: 1
                    sim_action_id: 647
                    shell: cmd.exe
                    created_at: '2021-08-26T06:15:01.674Z'
                    updated_at: '2021-08-26T06:15:01.674Z'
                    raw_text: ''
                    delivery_wait_time: 5
                    delivery_failed_result: blocked
                    destination_exists_result: overwrite
                    action_user_profile_id: null
                    monitor_connections: 'off'
                    user_variables: []
                    host_cli_action_steps: []
                    host_cli_action_file_transfer_libraries: []
                verodin_tags:
                - ATT&CK:Credential Access
                - ATT&CK:T1003
                - CWE:522
                user_tags: []
                os_tags:
                - OS:Windows Server:2016
                - OS:Windows:7
                control_tags:
                - Control:Endpoint
                run_as_tags:
                - RunAs:Admin
                - RunAs:SYSTEM
                src_destination_tags:
                - Src:Internal:Trusted
                user_os_tags: []
                user_control_tags: []
                user_run_as_tags: []
                user_src_destination_tags: []
                mitre_mitigation_tags:
                - ATT&CK:M1015
                - ATT&CK:M1017
                - ATT&CK:M1025
                - ATT&CK:M1026
                - ATT&CK:M1027
                - ATT&CK:M1028
                - ATT&CK:M1041
                - ATT&CK:M1043
                user_mitre_mitigation_tags: []
                nist_control_tags: []
                user_nist_control_tags: []
                hex?: false
                http?: false
      operationId: getManageSimsActions{id}Json
      x-operation-id-source: derived
    put:
      summary: Update an existing Action
      description: 'When updating an Action using the API, you can modify many (but not all) meta-properties specific to the Action, properties for the type of Action, or any additional Action configuration properties. You must pass in the existing Action''s trees, since they can be altered by removing or changing their values during submit.


        Please note that making changes to an Action may change the ID of that action. In general, altering just the name or the description will not cause the ID to change. Changes that affect the fundamental properties of the action will cause the current Action to become disabled (but not deleted) and a new Action to be generated that will show the updated properties requested. In this case, the ID provided in the response will be the ID for the new Action.


        The normal behavior of the PUT API call is to update the action with all attributes passed into the endpoint, and to remove any attributes or relationships that are not passed in.'
      tags:
      - Actions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The action ID to lookup.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/action_wrapped_with_core_updates'
            example:
              sim_action:
                action_type: file_transfer
                timeout_ms: '10000'
                name: Action 1
                desc: Action 1 Description - Altered
                captive_ioc_url_action_attributes:
                  urls: []
                  id: '2'
              trees:
              - '59'
              - '47'
              - '2'
              - '106'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                action_type: captive_ioc_url
                approved_version: 0
                brt_version: 0.0.1
                created: '2019-11-17T16:55:12Z'
