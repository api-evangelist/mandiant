components:
  schemas:
    port_scan_action:
      title: Port scan action
      type: object
      required:
      - attack_node_id_1
      - target_node_id_1
      - port_scan_sim_interface_1
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string
        target_node_id_1:
          type: string
          description: ID of the destination Actor as a string
        port_scan_mgmt_interface_1:
          type: string
          enum:
          - on off
          description: 'Use the management interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._

            '
        port_scan_sim_interface_1:
          type: string
          enum:
          - on off
          description: 'Use the test interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._

            '
        port_scan_monitor_interface_1:
          type: string
          enum:
          - on off
          description: 'Use the monitor interface in the port scan. _Note: One port_scan_*_interface_1 has to be "on" for the scan to run._

            '
        port_scan_both_directions_1:
          type: string
          description: 'Scan both directions between actors. _Note: will occur if value is present._

            '
    file_transfer_action:
      type: object
      required:
      - action_type
      - file_transfer_action_attributes
      properties:
        action_type:
          type: string
          enum:
          - file_transfer
        file_transfer_action_attributes:
          $ref: '#/components/schemas/file_transfer_action_attributes'
    action_wrapped_with_core_updates:
      type: object
      required:
      - sim_action
      properties:
        sim_action:
          $ref: '#/components/schemas/action'
        core_updates:
          type: boolean
          description: 'Flags Host CLI, Email, Web, and Socket Action-related PUT payloads as only containing updates for the core SimAction and particular Action Type object. Using this flag indicates that the payload will not contain any step or file dependency information fields, and will not expect changes in the step or file dependency relationships of the Action after the call has completed.

            '
    dns_query_action_attributes:
      type: object
      required:
      - domain
      - query_type
      properties:
        domain:
          type: string
          description: 'The domain name requested in the action

            '
        query_type:
          type: string
          enum:
          - A
          - AAAA
          - CNAME
          - MX
          - NS
          - null
          - PTR
          - SOA
          - SRV
          - TXT
    host_cli_action:
      type: object
      required:
      - action_type
      - host_cli_action_attributes
      - host_cli_action_steps_attributes
      properties:
        action_type:
          type: string
          enum:
          - host_cli
        host_cli_action_attributes:
          $ref: '#/components/schemas/host_cli_action_attributes'
    host_cli_action_attributes:
      type: object
      required:
      - shell
      properties:
        shell:
          type: string
          enum:
          - bash
          - python
          - cmd.exe
          description: Shell command
        delivery_wait_time:
          type: integer
          description: Wait time for delivery
        raw_text:
          type: string
          description: Command entry
        monitor_connections:
          type: string
          enum:
          - 'on'
          - 'off'
          description: Actively observe connections
        delivery_failed_result:
          type: string
          enum:
          - error
          description: Identify failure criteria
        destination_exists_result:
          type: string
          enum:
          - error
          description: Identify existence criteria
        host_cli_action_steps_attributes:
          type: array
          items:
            type: object
            required:
            - id
            - step_order
            - command
            properties:
              id:
                type: integer
                description: Unique step identifier
              step_order:
                type: integer
                description: 0-indexed step occurrence ordinal.
              command:
                type: string
                description: host cli command
              prompt:
                type: string
                description: Command prompt
              blocked_check:
                type: string
                enum:
                - match
                description: Blocking criteria
              blocked_match:
                type: string
                enum:
                - match text
                description: Blocking type
              incompatible_check:
                type: string
                enum:
                - match
                description: Incompatible criteria
              incompatible_match:
                type: string
                enum:
                - match text
                description: Incompatible type
              check_events:
                type: boolean
                description: Whether events need to be reviewed
              event_logs:
                type: boolean
                description: Event logs
              sleep:
                type: string
                description: Time to delay before next step
    run_action-action:
      oneOf:
      - $ref: '#/components/schemas/generic_action'
      - $ref: '#/components/schemas/host_cli_with_user_profile'
      - $ref: '#/components/schemas/run_action-cloud_action'
      - $ref: '#/components/schemas/port_scan_action'
    sleep_action:
      type: object
      required:
      - sleep_action
      properties:
        sleep_action:
          type: object
          required:
          - time_in_minutes
          properties:
            time_in_minutes:
              type: integer
              description: 'Number of minutes for the sleep action to take place

                '
    action_wrapped:
      type: object
      properties:
        sim_action:
          $ref: '#/components/schemas/action'
    run_action-cloud_action:
      title: Cloud action
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string. There is no target actor for cloud actions
        cloud_profile_ids:
          type: object
          description: "A list of cloud profiles to use when running the action. \n\nThe key should be \"1\" and the value should be an array of numbers, representing a cloud profile by its ID. See the `/cloud_profiles` endpoint to get a list of valid ids. Use `null` to pass no cloud profile\n\nThis example passes cloud profile ID 1 to the first script, and \"No Profile\" for the second script:\n```json\n\"cloud_profile_ids\": [\n  [\n    [1, null]\n  ]\n]\n```\n"
    cloud_action_attributes:
      type: object
      required:
      - script
      properties:
        scripts:
          type: object
          properties:
            name:
              type: string
              description: Name of the script
            script_text:
              type: string
              description: Python script to run
            script_type:
              type: string
              enum:
              - SETUP
              - CLEANUP
              - null
              description: 'SETUP - used for setup scripts.


                CLEANUP - used for cleanup scripts.


                Any other value is a "normal" script

                '
            timeout:
              type: integer
              description: Script timeout
        inputs_attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the variable
              default_value:
                type: string
                description: Default value
        outputs_attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the variable
        cloud_action_file_transfer_libraries:
          type: object
          required:
          - file_transfer_library_id
          properties:
            variable_name:
              type: string
              description: the name that will be used to reference this file in the action script
    action:
      allOf:
      - $ref: '#/components/schemas/action_common'
      - oneOf:
        - $ref: '#/components/schemas/file_transfer_action'
        - $ref: '#/components/schemas/cloud_action'
        - $ref: '#/components/schemas/dns_query_action'
        - $ref: '#/components/schemas/host_cli_action'
    action_common:
      type: object
      required:
      - name
      - desc
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of Action, must be unique
        desc:
          type: string
          description: Description of Action
    generic_action:
      title: Generic action
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string
        target_node_id_1:
          type: string
          description: ID of the destination Actor as a string
    cloud_action:
      type: object
      required:
      - action_type
      - cloud_action_attributes
      properties:
        action_type:
          type: string
          enum:
          - cloud
        cloud_action_attributes:
          $ref: '#/components/schemas/cloud_action_attributes'
    host_cli_with_user_profile:
      title: Host CLI with User Profile
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string
        action_user_profile_id:
          type: object
          description: "The key is the step that the Action User Profile will be attached to.  For single-Action runs, this is always \"1\".\n\nThe value is the ID of the User Profile that will be used.\n\nThis example shows a sample Action User Profile being used to run a single Action\n```json\n\"action_user_profile_id\": {\n  \"1\": 12\n}\n```\n"
    dns_query_action:
      type: object
      description: Malicious DNS Query Action
      required:
      - action_type
      - dns_query_action_attributes
      properties:
        action_type:
          type: string
          enum:
          - dns
        trees:
          type: object
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
                description: ID of the Tree to assign as Stage Of Attack for this Action.  The list of Trees is available from the `GET /manage_sims/actions/get_dimensions.json` API endpoint.
        dns_query_action_attributes:
          $ref: '#/components/schemas/dns_query_action_attributes'
    file_transfer_action_attributes:
      type: object
      required:
      - file_transfer_library_id
      properties:
        file_transfer_library_id:
          type: integer
          description: ID of Associated File Library object
        compare_transfer:
          description: Must be set to 1
        keep_after_compare:
          description: Must be set to 0
        content_encoding:
          type: string
          description: 'File encoding, for instance "zip".  This can be blank or a comma-separated list of

            supported encoding formats like "zip,tar,gzip"

            '
        method:
          type: string
          enum:
          - get
          - post
          description: Direction of transfer as an HTML verb
        app_layer:
          type: string
          enum:
          - http
          - ftp
          - https
          - scp
          - ''
          description: Application layer for tunnel.  Can be an empty string to indicate no tunnel.
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
        tunnel_cidr:
          type: string
          description: IP Address for CIDR tunnel.  Required for all tunnels
        tunnel_protocol:
          type: string
          enum:
          - dns
          - icmp
          - ssh
          - null
          description: Tunneling protocol.  Can be blank.
        dns_domain:
          description: 'DNS Domain.  This is only needed when defining a DNS tunnel file transfer

            '
        dns_server_ip:
          description: 'DNS Server IP address.  Optional and only applies to DNS tunnels.

            '
    cloud_action-2:
      title: Cloud action
      type: object
      properties:
        attack_node_id_1:
          type: string
          description: ID of the source Actor as a string. There is no target actor for cloud actions
        cloud_profile_ids:
          type: object
          description: "A list of cloud profiles to use when running the action. \n\nThe key should be \"1\" and the value should be an array of numbers, representing a cloud profile by its ID. See the `/cloud_profiles` endpoint to get a list of valid ids. Use `null` to pass no cloud profile\n\nThis example passes cloud profile ID 1 to the first script, and \"No Profile\" for the second script:\n```json\n\"cloud_profile_ids\": [\n  [\n    [1, null]\n  ]\n]\n```\n"
    action-2:
      oneOf:
      - $ref: '#/components/schemas/generic_action'
      - $ref: '#/components/schemas/cloud_action-2'
      - $ref: '#/components/schemas/port_scan_action'
