openapi: 3.2.0
info:
  title: Mandiant Templates API
  version: '1.0'
  contact: {}
  description: 'Operations tagged Templates across 2 of this provider''s published API definitions: mandiant-dtm-openapi.yml, mandiant-dtm-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.intelligence.mandiant.com/v4/dtm
security:
- My_API_Key: []
tags:
- name: Templates
paths:
  /monitors/templates/{id}/validate:
    parameters:
    - description: The template ID to validate against.
      in: path
      name: id
      required: true
      schema:
        type: string
    post:
      description: Perform a check of the monitor against a template.
      operationId: template-validation-id
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    message: Unauthorized
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Unauthorized
        '404':
          content:
            application/json:
              examples:
                not-found:
                  value:
                    message: Not Found
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Not Found
        '500':
          content:
            application/json:
              examples:
                internal-error:
                  value:
                    message: Internal Server Error
              schema:
                $ref: '#/components/schemas/Response-message'
          description: Internal Server Error
      summary: Validate a monitor against a template
      tags:
      - Templates
    servers:
    - url: https://api.intelligence.mandiant.com/v4/dtm
components:
  schemas:
    Response-message:
      description: Error response message.
      properties:
        message:
          description: The response message.
          type: string
      title: Error Response
      type: object
    Condition:
      description: A Condition forms the basis for querying topics and labels in monitors. It can be used to form complex conditions using all/any as well as specifying specific values to match for documents. See the user guide for more details.
      properties:
        match:
          description: The match values, or sub Conditions.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
        operator:
          description: The operator to use for this Condition.
          enum:
          - must_equal
          - must_not_equal
          - must_start_with
          - must_not_start_with
          - must_end_with
          - must_not_end_with
          - must_contain
          - must_not_contain
          - any
          - all
          type: string
        topic:
          description: The topic to apply this Condition to.
          enum:
          - doc_type
          - source
          - match_conditions
          - credential_domain
          - typosquatted_domain
          - keyword
          - lucene
          - group_bin
          - group_brand
          - group_crypto
          - group_hash
          - group_identity
          - group_keys
          - group_location
          - group_network
          - group_paths
          - group_social
          - group_threats
          - label_industry
          - label_language
          - label_threat
          - label_type
          - bin
          - bin_foreign
          - bin_partial
          - identity_name
          - organization
          - product
          - name
          - brand
          - product_batch_name
          - atom_address
          - bch_address
          - btc_address
          - dash_address
          - doge_address
          - ltc_address
          - xlm_address
          - xmr_address
          - zec_address
          - sha1_hash
          - sha256_hash
          - md5_hash
          - client_identifier
          - email_address
          - identity_name
          - twitter_handle
          - telegram_user_name
          - phone_number
          - access_token
          - crypto_key_private
          - crypto_key_public
          - password_plaintext
          - predict_password_plaintext
          - location_name
          - city
          - country
          - ipv4_address
          - ipv6_address
          - domain
          - mac_address
          - url
          - filename
          - path
          - registry_key
          - hashtag
          - icq_uin
          - jid
          - cve
          - threat_name
          - threat_group_name
          - service_name
          - cwe
          type: string
      required:
      - operator
      - topic
      - match
      title: Condition
      type: object
    Monitor:
      description: A monitor defines 1 or more conditions and an optional doc query string to use for matching documents of interest. Matching a document results in the creation of an alert.
      properties:
        created_at:
          description: The timestamp the monitor was created.
          example: '"2021-08-19T19:48:36Z"'
          format: date-time
          readOnly: true
          type: string
        created_by_user_email:
          description: The user's name that created the monitor.
          readOnly: true
          type: string
        created_by_user_id:
          description: The ID of the user that created the monitor.
          readOnly: true
          type: string
        description:
          description: The description of the monitor.
          type: string
        doc_condition:
          $ref: '#/components/schemas/Condition'
        email_notify_enabled:
          description: If email notifications are enabled for this monitor.
          type: boolean
        email_notify_immediate:
          description: If immediate email delivery is enabled for this monitor.
          type: boolean
        enabled:
          description: If the monitor is enabled or not.
          type: boolean
        id:
          description: The ID of the monitor.
          example: c4fbb52bqsiatib6i4gg
          readOnly: true
          type: string
        last_updated_by_user_id:
          description: The ID of the user that last updated the monitor.
          readOnly: true
          type: string
        last_updated_user_email:
          description: The user's name that last updated the monitor.
          readOnly: true
          type: string
        name:
          description: The name of the monitor.
          type: string
        password_policy:
          $ref: '#/components/schemas/PasswordPolicy'
        template_id:
          description: If a monitor was created from a template, then this field is populated with the template's ID. It cannot be changed after creation.
          readOnly: true
          type: string
        updated_at:
          description: The timestamp the monitor was last updated.
          example: '"2021-08-19T19:48:36Z"'
          format: date-time
          readOnly: true
          type: string
        version:
          description: The version number for the monitor. A monitor's version is incremented each time the monitor is updated.
          readOnly: true
          type: integer
      required:
      - doc_condition
      title: Monitor
      type: object
    PasswordPolicy:
      description: Criteria defining a password policy.
      properties:
        length_max:
          description: The maxium length of the password in order to meet the policy.
          readOnly: false
          type: integer
        length_min:
          description: The minimum length of the password in order to meet the policy.
          readOnly: false
          type: integer
        lowercase_char_count:
          description: The minimum numer of lowercase characters a password is expected to have in order to meet the policy.
          readOnly: false
          type: integer
        lowercase_char_required:
          description: If true, then the password is expected to have lowercase characters in order to meet the policy.
          readOnly: false
          type: boolean
        numbers_count:
          description: The minimum numer of numerical characters a password is expected to have in order to meet the policy.
          readOnly: false
          type: integer
        numbers_required:
          description: If true, then the password is expected to have numerical characters in order to meet the policy.
          readOnly: false
          type: boolean
        special_char_count:
          description: The minimum numer of special case characters a password is expected to have in order to meet the policy.
          readOnly: false
          type: integer
        special_char_required:
          description: If true, then the password is expected to have special case characters in order to meet the policy.
          readOnly: false
          type: boolean
        uppercase_char_count:
          description: The minimum numer of uppercase characters a password is expected to have in order to meet the policy.
          readOnly: false
          type: integer
        uppercase_char_required:
          description: If true, then the password is expected to have uppercase characters in order to meet the policy.
          readOnly: false
          type: boolean
      title: Password Policy
      type: object
  securitySchemes:
    My_API_Key:
      scheme: bearer
      type: http
x-refined-from:
- mandiant-dtm-openapi.yml
- mandiant-dtm-openapi.yml
