openapi: 3.2.0
info:
  title: Mandiant Cloud Profiles API
  version: '1.0'
  description: 'Operations tagged Cloud Profiles across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Cloud Profiles
  description: Cloud profiles provide a secure way to use credentials when running cloud actions. They are made available in your scripts as environment variables. Once entered, sensitive fields (such as secret keys) and any custom values will not show up in the UI or API and are encrypted at rest.
paths:
  /cloud_profiles:
    get:
      summary: List cloud profiles
      tags:
      - Cloud Profiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - id: 1
                name: AWS Profile
                auth_type: aws
                options:
                  AWS_ACCESS_KEY_ID: ASDF123456QWERTY
                  AWS_SECRET_ACCESS_KEY: null
                  AWS_SESSION_TOKEN: null
                  also_custom_key: null
                description: This is an AWS Profile
                disabled: false
                organization_id: 1
                created_at: '2022-03-25T23:12:20.867Z'
                updated_at: '2022-03-25T23:12:37.202Z'
              - id: 2
                name: Custom Profile
                auth_type: custom
                options:
                  my_secret: null
                description: Custom profile
                disabled: false
                organization_id: 1
                created_at: '2022-04-05T16:38:32.511Z'
                updated_at: '2022-04-05T16:38:32.511Z'
      operationId: getCloudProfiles
      x-operation-id-source: derived
    post:
      summary: Create a cloud profile
      tags:
      - Cloud Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cloud_profile_wrapped'
            example:
              cloud_profile:
                auth_type: aws
                description: some description
                name: aws cloud profile
                options:
                  AWS_ACCESS_KEY_ID: my-access-key
                  AWS_SECRET_ACCESS_KEY: my-secret-access-key
                  AWS_SESSION_TOKEN: my-session-token
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 2
                name: aws cloud profile
                auth_type: aws
                options:
                  AWS_ACCESS_KEY_ID: my-access-key
                  AWS_SECRET_ACCESS_KEY: null
                  AWS_SESSION_TOKEN: null
                description: null
                disabled: false
                organization_id: 1
                created_at: '2022-04-05T19:22:28.752Z'
                updated_at: '2022-04-05T19:22:28.752Z'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                name:
                - has already been taken
      operationId: postCloudProfiles
      x-operation-id-source: derived
  /cloud_profiles/{id}:
    get:
      summary: Get cloud profile
      tags:
      - Cloud Profiles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The ID of the cloud profile to get.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 1
                name: AWS Profile
                auth_type: aws
                options:
                  AWS_ACCESS_KEY_ID: ASDF123456QWERTY
                  AWS_SECRET_ACCESS_KEY: null
                  AWS_SESSION_TOKEN: null
                  also_custom_key: null
                description: This is an AWS Profile
                disabled: false
                organization_id: 1
                created_at: '2022-03-25T23:12:20.867Z'
                updated_at: '2022-03-25T23:12:37.202Z'
        '404':
          description: Not Found
      operationId: getCloudProfilesById
      x-operation-id-source: derived
components:
  schemas:
    cloud_profile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name that is used to refer to this Cloud Profile
        auth_type:
          type: string
          description: 'The auth type of the cloud profile. Valid values: AWS, Basic Auth, Custom'
          enum:
          - aws
          - basic_auth
          - custom
        options:
          type: object
          description: 'This should be an object with "key": "value" format, where key is the environment variable name and value is the value that you want available in your cloud actions

            '
        disabled:
          type: boolean
          description: True if disabled, false if enabled
    cloud_profile_wrapped:
      type: object
      properties:
        cloud_profile:
          $ref: '#/components/schemas/cloud_profile'
