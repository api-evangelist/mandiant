info:
  title: Mandiant Integration Events API
  version: '1.0'
  description: 'Operations tagged Integration Events across 4 of this provider''s published API definitions: mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Integration Events
  description: Events that came from an integration configured on the Director. This does not include events that come from local logs for Host CLI Actions.
paths:
  /integration_events:
    get:
      summary: List Integration Events
      description: Get an array of IntegrationEvent objects, optionally filtered by certain values. Events are returned in order of descending ID.
      tags:
      - Integration Events
      parameters:
      - name: filter[id]
        in: query
        description: 'An integer, array of integers, or comma-separated string of integers indicating the IntegrationEvent ID(s) to filter on.

          '
        schema:
          oneOf:
          - type: string
          - type: integer
          - type: array
      - name: filter[job_action_id]
        in: query
        description: 'An integer, array of integers, or comma-separated string of integers indicating the JobAction ID(s) to filter on

          '
        schema:
          oneOf:
          - type: string
          - type: integer
          - type: array
      - name: filter[integration_id]
        in: query
        description: 'An integer, array of integers, or comma-separated string of integers indicating the Integration ID(s) to filter on

          '
        schema:
          oneOf:
          - type: string
          - type: integer
          - type: array
