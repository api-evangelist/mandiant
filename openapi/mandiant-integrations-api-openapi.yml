      operationId: getApiV1ProjectsByUuidIntegrations
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/v1/projects/{uuid}/integrations/jira/projects:
    get:
      tags:
      - Integrations
      summary: Jira projects
      parameters:
      - name: INTRIGUE_ACCESS_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: uuid
        in: path
        schema:
          type: string
        required: true
        description: 'Required: uuid from {{base_url}}/api/v1/projects'
        example: '{{project_uuid}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiV1ProjectsByUuidIntegrationsJiraProjects
      x-operation-id-source: derived
    servers:
    - url: http://{{base_url}}
  /api/v1/integrations/{uuid}:
