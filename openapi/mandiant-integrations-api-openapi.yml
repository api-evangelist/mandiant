      operationId: getIntegrations
      x-operation-id-source: derived
    post:
      summary: Create a new integration
      description: The allowed/required params depend on the integration type so it is helpful to first make a call to the GET /integrations/new?integration_type= route which will return a blank template for your desired integration.
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/integration_type'
            example:
              arcsight_integration:
                discovery_enabled: true
                filter_uri: /All Filters/Personal/integration_user's filters/Verodin Filter
                host: 10.0.23.12
                password: testpassword
                port: 8443
                protocol: https
                query_viewer_name: Verodin Query Viewer
                query_timeout: 60
                username: integration_user
      responses:
        '201':
          description: Created
      operationId: postIntegrations
      x-operation-id-source: derived
  /integrations/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: The ID of the integration to lookup.
    get:
      summary: Get an individual integration
      tags:
      - Integrations
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                Request:
                  created_at: '2016-09-22T19:29:46Z'
                  disabled: false
                  discovery_enabled: true
                  filter_uri: /All Filters/Personal/integration_user's Filters/test filter
                  host: 10.0.23.12
                  id: 1
                  initial_filter_set: false
                  node_ips:
                  - 192.168.45.129
                  - 192.168.45.40
                  - 192.168.45.41
                  organization_id: 1
                  port: 8443
                  protocol: https
                  query_viewer_name: local integration query viewer
                  query_timeout: 60
                  require_rule_match: false
                  type: ArcsightIntegration
                  updated_at: '2017-04-07T18:59:05Z'
                  username: integration_user
      operationId: getIntegrationsById
      x-operation-id-source: derived
    put:
      summary: Update an existing integration
      description: Like the POST /integrations route, the allowed/required params depend on the integration type so it can be helpful to first make a call to the GET /integrations/{id} route which will return the current attributes for the integration.
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema: {}
            example:
              arcsight_integration:
                discovery_enabled: true
                filter_uri: /All Filters/personal/integration_user's Filters/Verodin Filter
                host: 10.0.23.12
                password: newpassword
                port: 8443
                protocol: https
                query_viewer_name: Verodin Query Viewer
                username: integration_user
      responses:
        '200':
          description: Success
      operationId: putIntegrationsById
      x-operation-id-source: derived
    delete:
      summary: Remove an existing integration
      tags:
      - Integrations
      responses:
        '200':
          description: Success
      operationId: deleteIntegrationsById
      x-operation-id-source: derived
  /integrations/{id}/test:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
      description: The ID of the integration.
    get:
      summary: Get default test query for an integration
      description: A value of null means the integration test doesn't take a query. A typical flow when wanting to run a test query from the API would be to first make a request to this endpoint, then use the query returned in a request to `POST /integrations/{id}/test`
      tags:
      - Integrations
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                query: search earliest=-5m | head 1 | fields host,source,sourcetype
      operationId: getIntegrationsByIdTest
      x-operation-id-source: derived
    post:
      summary: Run the test function for an integration
      description: If you're unsure of what to use for a test query, or whether a particular integration type needs one supplied, check the `GET /integrations/{id}/test` endpoint first and use the "query" value returned from it.
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 'Required for integration types that use a query

                '
              properties:
                test_query:
                  type: object
                  properties:
                    test_query:
                      type: string
            example:
              test_query:
                test_query: search * | head 1 | fields source,sourcetype
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                Request:
                  success:
                  - Host, port, and protocol are correct
                  - Valid credentials
                  - Sufficient user permissions
                  errors: []
                  query_result: 'source: udp:8514

                    sourcetype: example

                    _time: 2019-11-27T23:18:07.000+00:00


                    '
      operationId: postIntegrationsByIdTest
      x-operation-id-source: derived
  /msi_integrations:
    get:
      summary: List Active MSI integrations.
      tags:
      - Integrations
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
              - organization_id: 1
                id: 1
                paused: false
                disabled: false
                type: elasticsearch
                brand_name: Elasticsearch
                msi_version: v1
                config:
                  meta_config: {}
                  conn_config: {}
                  runtime_config:
                    queries: []
                    alert_query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"@timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                    field_map:
                      __default__:
                        uid: []
                        start_time: []
                        description: []
                        src_ip: []
                        src_port: []
                        dest_ip: []
                        dest_port: []
                        url: []
                        email_sender: []
                        email_recipient: []
                        email_subject: []
                        host: []
                        computer: []
                        user: []
                        sid: []
                    alert_field_map:
                      uid: []
                      description: []
                      start_time: []
                      host: []
                      base_event_uids: []
                    max_pages: 100
                    page_size: 500
                  queries_with_labels:
                  - name: IP Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%IPS%) OR destination.ip:(%IPS%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: Hostname Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(source.ip:(%HOSTNAMES%) OR destination.ip:(%HOSTNAMES%) OR\\nhost.hostname:(%HOSTNAMES%)) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: DNS Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"domain:(%DOMAINS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                  - name: Email Query
                    query: "{\n  \"query\": {\n    \"query_string\": {\n      \"query\": \"(sender:(%SENDERS%) OR recipient:(%RECIPIENTS%) AND @timestamp:[%START_TIME% TO %END_TIME%]\"\n    }\n  }\n}"
                int_app_owned: null
                msi_uuid: null
                host: host.com
                correlation_query_enabled: false
                last_query_results_at: null
                remote: false
                node_id: null
                updated_at: '2025-05-14T20:08:32.068Z'
                time_adjustment: 0
                name: elasticsearch
                discovery_enabled: true
                query_min_back: 15
                delay_time: 0
                correlation_query: ''
                query_frequency: 30
                correlation_query_frequency: 60
                created_at: '2025-05-14T20:08:32.068Z'
                last_query: null
                save_suspect_events: false
                query_results_limit: 10000
                correlation_query_min_back: 60
      operationId: getMsiIntegrations
      x-operation-id-source: derived
    post:
      summary: Creates a new MSI Integration
      description: The spec endpoint can be used as reference for the Integration configuration schema
      tags:
      - Integrations
      parameters:
      - name: type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/msi_type'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/msi_integration'
            example:
              integration:
                organization_id: 1
                id: 1
                paused: false
                disabled: false
                brand_name: Palo Alto Networks Next-Gen Firewall
                msi_version: v1
                config:
                  meta_config: {}
                  conn_config:
                    protocol: https
                    port: 443
                    appliance_type: Panorama Console
                    verify_ssl: false
                    timeout: 30
                    host: 10.10.0.3
                    username: admin
                  runtime_config:
                    appliance_timezone: UTC
                    log_types:
                    - traffic
                    - threat
                    queries:
                    - (%IPS%) and (time_generated geq '%START_TIME%') and (time_generated leq '%END_TIME%')
                    page_size: 1000
                    query_max_pages: 10
                    field_map:
                      src_ip:
                      - src
                      src_port:
                      - sport
                      dest_ip:
                      - dst
                      dest_port:
                      - dport
                      start_time:
                      - __default__
                      uid:
                      - __default__
                      sid: []
                      url: []
                      email_sender: []
                      email_recipient: []
                      email_subject: []
                      description:
                      - __default__
                      host:
                      - __default__
                      computer:
                      - __default__
                      user: []
                      filehashes: []
                host: 10.10.0.3
                correlation_query_enabled: false
                last_query_results_at: '2025-04-24T16:06:04.318Z'
                node_id: null
                updated_at: '2025-04-24T16:06:04.340Z'
                time_adjustment: 0
                name: panoramaa
                discovery_enabled: true
                query_min_back: 15
                delay_time: 0
                correlation_query: ''
                query_frequency: 30
                correlation_query_frequency: 60
                created_at: '2025-04-17T18:07:12.016Z'
                last_query: (%IPS%) and (time_generated geq '%START_TIME%') and (time_generated leq '%END_TIME%')
                save_suspect_events: false
                query_results_limit: 10000
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
      operationId: postMsiIntegrations
      x-operation-id-source: derived
