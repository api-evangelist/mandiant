      tags:
      - Integrations
      summary: Destroy
      description: 'Delete an existing integration. This cannot be undone!


        To obtain a UUID for your integration, please see the GET Index query first:


        ![](https://content.pstmn.io/f577cdca-1f0b-49b5-9515-14872c74b4ca/SW50ZWdyYXRpb24gRGVzdHJveS5wbmc=)'
      parameters:
      - name: INTRIGUE_ACCESS_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: uuid
        in: path
        schema:
          type: string
        required: true
        description: uuid from {{base_url}}/api/v1/projects/:uuid/integrations
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Fri, 09 Sep 2022 16:56:48 GMT
            Content-Type:
              schema:
                type: string
                example: application/json
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Vary:
              schema:
                type: string
                example: Origin
            Via:
              schema:
                type: string
                example: 1.1 vegur
            CF-Cache-Status:
              schema:
                type: string
