openapi: 3.2.0
info:
  title: Mandiant Integrations API
  version: '1.0'
  description: 'Operations tagged Integrations across 6 of this provider''s published API definitions: mandiant-asm-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml, mandiant-asm-openapi.yml, mandiant-ma-sv-openapi.yml, mandiant-msv-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://{{base_url}}
tags:
- name: Integrations
  description: Add your integration(s) here. Once added you can associate them to a collection within the Integrations Collections section.
paths:
  /api/v1/projects/{uuid}/integrations:
    post:
      tags:
      - Integrations
      summary: Create
      description: 'Attack Surface Management currently supports the following integrations, Use the samples in the post body:


        _**GCP**_:


        ``` json

        {

        "name": "Test GCP Integration",

        "secrets": {

        "service_account_email": "Email.Address@Service-Account-here.com"

        },

        "type": "GcpCredential"

        }


        ```


        **Jira:**


        ``` json

        {

        "name": "Test JIRA Integration",

        "secrets": {

        "jira_api_key": "APIKEYHERE",

        "host": "hostname.com",

        "username": "Email.Address@here.com"

        },

        "type": "jira"

        }


        ```


        **Azure:**


        ``` json

        {

        "name": "Test Azure Integration",

        "secrets": {

        "tenant_id": "TenantIdhere"

        },

        "type": "azure"

        }


        ```


        **Github:**


        ``` json

        {

        "name": "Test github Integration",

        "secrets": {

        "github_access_token": "TokenHere"

        },

        "type": "github"

        }


        ```


        **Akamai:**


        ``` json

        {

        "name": "Test akamai Integration",

        "secrets": {

        "client_secret": "SecretHere",

        "host": "hosthere.com",

        "access_token": "AccessTokenHere",

        "client_token": "ClientTokenHere"

        },

        "type": "akamai"

        }


        ```


        **Godaddy:**


        ``` json

        {

        "name": "Test godaddy Integration",

        "secrets": {

        "api_key": "KeyHere",

        "api_secret": "SecretHere"

        },

        "type": "godaddy"

        }


        ```


        **Cloudflare:**


        ``` json

        {

        "name": "Test cloudflare Integration",

        "secrets": {

        "cloudflare_api_key": "APIKeyHere"

        },

        "type": "cloudflare"

        }


        ```


        **AWS Roles:**


        ``` json

        {

        "name": "Test AwsCredential Integration",

        "secrets": {

        "aws_role_arn": "RoleHere"

        },

        "type": "AwsCredential"

        }


        ```


        **AWS Keys:**


        ``` json

        {

        "name": "Test AwsCredential Integration",

        "secrets": {

        "aws_access_key_id": "KeyHere",

        "aws_secret_access_key": "SecretHere",

        },

        "type": "AwsCredential"

        }


        ```'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Test JIRA Integration
                secrets:
                  jira_api_key: APIKEYHERE
                  host: hostname.com
                  username: Email.Address@here.com
                type: jira
      parameters:
      - name: INTRIGUE_ACCESS_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: uuid
        in: path
        schema:
          type: string
        required: true
        description: 'Required: uuid from {{base_url}}/api/v1/projects'
        example: '{{project_uuid}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiV1ProjectsByUuidIntegrations
      x-operation-id-source: derived
    get:
      tags:
      - Integrations
      summary: Index
      description: List all integrations configured for the project.
      parameters:
      - name: INTRIGUE_ACCESS_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_access_key}}'
      - name: INTRIGUE_SECRET_KEY
        in: header
        schema:
          type: string
        example: '{{intrigue_secret_key}}'
      - name: uuid
