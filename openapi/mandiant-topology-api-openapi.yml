  /topology/nodes/{id}/theater_restart:
    put:
      summary: Restart an individual Protected Theater virtual domain
      description: A 302 response indicates that the comamnd to restart the virtual domain was successfully sent to the Protected Theater.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: image
        in: query
        required: true
        schema:
          type: integer
          enum:
          - windows
          - virtual
        description: 'The virtual domain to restart. The ''virtual'' option will restart the inetsim domain.

          '
      - name: command
        in: query
        required: false
        schema:
          type: integer
          enum:
          - start
          - restart
          default: restart
        description: 'The command used to start, or restart the virtual domain.

          '
      tags:
      - Topology
      responses:
        '302':
          description: Found
          content:
            text/html:
              example: <html><body>You are being <a href="https://director/topology/nodes/1/image_status">redirected</a>.</body></html>
        '404':
          description: Not Found
          content:
            application/json:
              example:
                status: '404'
                error: Not Found
      operationId: putTopologyNodesByIdTheaterRestart
      x-operation-id-source: derived
